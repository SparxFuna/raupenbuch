/* ---- Auswertung ---- */
VIEWS.stats = () => {
  const inds = all("individuals");
  const deaths = inds.map(i=>[i,deathOf(i)]).filter(([i,d])=>d && !firstEv(i,"falterschlupf"));
  let h = `<div class="pagehead"><h1>Auswertung</h1><p class="muted" style="margin:0">Über alle Zuchtansätze. Bei kleinen Zahlen sind Unterschiede oft Zufall: achte auf n.</p></div>`;
  const byCause = {}; deaths.forEach(([i,d])=>{ const c=d.data?.cause||"unbekannt"; (byCause[c] ||= {s:0,v:0}); byCause[c][d.data?.certainty==="vermutet"?"v":"s"]++; });
  const maxC = Math.max(1,...Object.values(byCause).map(x=>x.s+x.v));
  h += `<section class="sec"><div class="sec-h"><h2>Verluste nach Ursache</h2><span class="small muted">n=${deaths.length}</span></div><div class="card">${deaths.length? `<div class="bars">${Object.entries(byCause).sort((a,b)=>(b[1].s+b[1].v)-(a[1].s+a[1].v)).map(([c,x])=>`<div class="bar"><span class="lbl" title="${esc(CAUSES[c]||c)}">${esc(CAUSES[c]||c)}</span><span class="track2"><i style="width:${x.s/maxC*100}%"></i><i class="v" style="width:${x.v/maxC*100}%"></i></span><span class="v">${x.s+x.v}</span></div>`).join("")}</div><div class="legend" style="margin-top:8px"><span><i style="background:var(--crit)"></i>sicher</span><span><i style="background:repeating-linear-gradient(135deg,var(--crit) 0 3px,var(--crit-soft) 3px 6px)"></i>Verdacht</span></div>` : `<div class="empty" style="padding:4px 0">Keine Verluste eingetragen.</div>`}</div></section>`;
  const byStage = {}; deaths.forEach(([i,d])=>{ const s = d.data?.stage || currentStage(i); byStage[s]=(byStage[s]||0)+1; });
  if(deaths.length){ const mx=Math.max(...Object.values(byStage));
    h += `<section class="sec"><div class="sec-h"><h2>Verluste nach Stadium</h2></div><div class="card bars">${STAGES.filter(s=>byStage[s.k]).map(s=>`<div class="bar"><span class="lbl">${s.l}</span><span class="track2"><i style="width:${byStage[s.k]/mx*100}%"></i></span><span class="v">${byStage[s.k]}</span></div>`).join("")}</div></section>`; }
  // Verluste je Behälter / Ansatz
  const grp = (keyFn, nameFn) => { const g={}; inds.forEach(i=>{ const k=keyFn(i); if(!k) return; (g[k] ||= {n:0,l:0}); g[k].n++; if(statusOf(i)==="tot" && !firstEv(i,"falterschlupf")) g[k].l++; }); return Object.entries(g).map(([k,x])=>({name:nameFn(k),...x})); };
  const bb = grp(i=>i.broodId, k=>S.broods[k]?.name||"?");
  const bc = grp(i=>i.containerId, k=>S.containers[k]?.name||"?");
  const tbl = (rows,title) => rows.length? `<section class="sec"><div class="sec-h"><h2>${title}</h2></div><div class="card tw"><table class="t"><thead><tr><th></th><th>Tiere</th><th>Verluste</th><th>Anteil</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.n}</td><td>${r.l}</td><td>${fmtN(r.l/r.n*100,0)} %</td></tr>`).join("")}</tbody></table></div></section>` : "";
  h += tbl(bb,"Verluste je Zuchtansatz") + tbl(bc,"Verluste je Behälter");
  // Puppenruhe je Art
  for(const sp of all("species")){
    for(const basis of ["eingegraben","verpuppt"]){
      const ds = pupalDurations(sp.id, basis); if(!ds.length) continue;
      const g = s => ds.filter(x=>x.sex===s).map(x=>x.d);
      const line = (l,a) => a.length? `<tr><td>${l}</td><td>${a.length}</td><td>${Math.min(...a)}</td><td>${fmtN(median(a),1)}</td><td>${Math.max(...a)}</td></tr>` : "";
      h += `<section class="sec"><div class="sec-h"><h2>Puppenruhe <span class="sp" style="text-transform:none;letter-spacing:0">${esc(sp.sci)}</span></h2><span class="small muted">${basis==="verpuppt"?"ab Verpuppung":"ab Eingraben"}</span></div><div class="card tw"><table class="t"><thead><tr><th></th><th>n</th><th>min</th><th>Median</th><th>max</th></tr></thead><tbody>${line("Weibchen",g("f"))}${line("Männchen",g("m"))}${line("unbekannt",g("u"))}${line("alle",ds.map(x=>x.d))}</tbody></table></div></section>`;
    }
  }
  return h;
};

VIEWS.search = () => {
  const q = (R.gq||"").toLowerCase().trim();
  let h = `<div class="search">${svg("search").replace('<svg','<svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:1.8"')}<input id="gq" placeholder="Name, Art, Notiz, Futterpflanze …" value="${esc(R.gq||"")}" autofocus></div>`;
  if(!q) return h + `<p class="muted small">Durchsucht Tiere, Zuchtansätze, Arten, Falter und Notizen in Ereignissen.</p>`;
  const has = s => (s||"").toLowerCase().includes(q);
  const I = all("individuals").filter(i=>has(i.name)||has(i.notes)||tagsOf(i).some(t=>has(t)||has("#"+t))).sort(byName);
  const B = all("broods").filter(b=>has(b.name)||has(b.notes)||has(S.species[b.speciesId]?.sci)||has(S.species[b.speciesId]?.de)||has(spCommon(S.species[b.speciesId]))||has(S.sources[b.sourceId]?.name));
  const M = openImagos().filter(m=>has(m.label)||has(m.notes));
  const E = all("events").filter(e=>has(e.note)||has(evTitle(e))).sort((a,b)=>(b.t0||"").localeCompare(a.t0||"")).slice(0,40);
  const sec = (t,arr,fn) => arr.length? `<section class="sec"><div class="sec-h"><h2>${t}</h2><span class="small muted">${arr.length}</span></div><div class="list">${arr.map(fn).join("")}</div></section>` : "";
  h += sec("Tiere",I,i=>indRow(i)) + sec("Zuchtansätze",B,broodRow) + sec("Offene Falter",M,imagoRow)
    + sec("Ereignisse",E,e=>`<button class="row" ${e.individualId?`data-go="animal:${e.individualId}"`:`data-act="editEvent" data-id="${e.id}"`}><span class="main"><span class="t">${esc(evTitle(e))}</span><span class="s">${esc(e.individualId?indName(e.individualId):"")} · ${esc(fmtTime(e))}${e.note?" · "+esc(e.note):""}</span></span></button>`);
  if(!I.length&&!B.length&&!M.length&&!E.length) h += `<p class="muted">Nichts gefunden für „${esc(R.gq)}“.</p>`;
  return h;
};

}

const speciesOpts = () => all("species").sort((a,b)=>a.sci.localeCompare(b.sci)).map(s=>[s.id, `${s.sci}${spCommon(s)?" – "+spCommon(s):""}`]);
const sourceOpts = () => [["","– keine –"], ...all("sources").sort(byName).map(s=>[s.id,s.name])];
const contOpts = () => [["","– kein Behälter –"], ...all("containers").sort(byName).map(c=>[c.id, c.name])];
const locOpts = () => [["","– kein Standort –"], ...all("locations").sort(byName).map(l=>[l.id,l.name])];
const stageOpts = () => [["?","unbekannt"], ...STAGES.filter(s=>s.k!=="falter").map(s=>[s.k, s.l])];

/* ---- Zuchtansatz ---- */
ACTS.newBrood = () => broodSheet();
ACTS.editBrood = d => broodSheet(S.broods[d.id]);
function broodSheet(b){
  const sp = speciesOpts();
  const root = openSheet(`<h2>${b?"Zuchtansatz bearbeiten":"Neuer Zuchtansatz"}</h2>
    ${fld.text("bName","Name",b?.name||"", "z. B. Atropos 2026")}
    ${fld.sel("bSp","Art",sp,b?.speciesId||sp[0]?.[0])}
    <div class="frow2">${fld.sel("bSrc","Herkunft",[...sourceOpts(),["__new","+ neue Herkunft …"]],b?.sourceId||"")}${fld.text("bGen","Generation",b?.generation||"","z. B. 1")}</div>
    ${fld.text("bSrcNew","Name der neuen Herkunft","","z. B. Jana")}
    <div class="frow2">${fld.date("bStart","Startdatum",b?.startDate||todayISO())}${fld.sel("bStage","Start als",stageOpts(),b?.startStage||"L1")}</div>
    ${fld.area("bNotes","Notizen",b?.notes||"")}
    <div class="btns"><button class="btn primary" id="ok">${b?"Speichern":"Anlegen"}</button>${b?`<button class="btn danger" id="del">Löschen</button>`:""}</div>
    ${b?confirmBlock(`„${esc(b.name)}“ mit allen ${indsOf(b.id).length} Tieren und deren Einträgen löschen?`,"Endgültig löschen"):""}`);
  const nw = root.querySelector("#bSrcNew").closest(".f"); nw.hidden = true;
  root.querySelector("#bSrc").addEventListener("change", e => nw.hidden = e.target.value!=="__new");
  root.querySelector("#ok").addEventListener("click", async () => {
    const name = val(root,"bName"); if(!name){ toast("Bitte einen Namen eingeben"); return; }
    let sourceId = val(root,"bSrc");
    if(sourceId==="__new"){ const sn = val(root,"bSrcNew"); sourceId = sn ? await store.put("sources",{name:sn,type:"zuechter"}) : ""; }
    const id = await store.put("broods",{...(b||{}), name, speciesId:val(root,"bSp"), sourceId:sourceId||null, generation:val(root,"bGen"), startDate:val(root,"bStart"), startStage:val(root,"bStage"), notes:val(root,"bNotes")});
    closeSheet(); if(!b) nav("brood",{id});
  });
  if(b) wireConfirm(root,"#del", async () => {
    closeSheet(); const inds = indsOf(b.id);
    for(const i of inds){ for(const e of evOf(i.id)) await store.del("events",e.id); await store.del("individuals",i.id); }
    for(const e of (evIndex().brood[b.id]||[])) await store.del("events",e.id);
    await store.del("broods",b.id); R.stack=[{v:"animals"}]; render(); toast("Zuchtansatz gelöscht");
  });
}

/* ---- Tiere hinzufügen (inkl. Notizen-Import) ---- */
ACTS.addInds = d => {
  const b = S.broods[d.id];
  const root = openSheet(`<h2>Tiere hinzufügen</h2>
    <div class="seg" role="group"><button data-m="count" aria-pressed="true">Anzahl</button><button data-m="names" aria-pressed="false">Mit Namen</button><button data-m="notes" aria-pressed="false">Aus Notizen</button></div>
    <div id="mCount">${fld.num("iCount","Wie viele Tiere?","","1")}<div class="hint">Die Tiere werden automatisch benannt, z. B. <span class="mono">${esc(nextAutoNames(b.speciesId,2).join(", "))} …</span> Umbenennen geht jederzeit.</div>
      ${fld.sel("iSexC","Geschlecht",[["u","unbekannt"],["f","Weibchen"],["m","Männchen"]],"u")}</div>
    <div id="mNames" hidden>${fld.area("iNames","Namen","", "Sirius, Polaris, Vega …")}<div class="hint">Durch Komma oder Zeilenumbruch trennen.</div>
      ${fld.sel("iSex","Geschlecht",[["u","unbekannt"],["f","Weibchen"],["m","Männchen"]],"u")}</div>
    <div id="mNotes" hidden>${fld.area("iNotes","Eine Zeile pro Tier","", "Sirius; m; 21.08.2026; 24.09.2026\nVega; w; 22.08.2026\nDeneb; w; 23.08.2026; Nacht 27.09.2026")}
      ${evExtraFields("eingegraben",{_new:true, _spId:b.speciesId})}
      <div class="hint">Format: <span class="mono">Name; Geschlecht; eingegraben; geschlüpft</span>. Geschlecht als m, w oder ?. Hinten darf etwas fehlen. Ohne Namen die Zeile mit <span class="mono">;</span> beginnen, z. B. <span class="mono">; w; 22.08.2026</span>. Vor ein Schlupfdatum kannst du „Nacht“ schreiben, wenn es über Nacht war (Datum des Abends).</div></div>
    ${fld.sel("iCont","Behälter",contOpts(),"")}
    <div class="frow2">${fld.sel("iStage","Aktuelles Stadium",[["",`wie Ansatz (${stageLabel(b.startStage||"L1")})`],["?","unbekannt"],...STAGES.map(s=>[s.k,s.l])],"")}<div class="f" id="iStageDW" hidden><label for="iStageD">erreicht am</label><input id="iStageD" type="date"></div></div>
    <div class="hint" id="iStageH" hidden>Datum leer lassen, wenn du es nicht weißt. Dann wird nur das Stadium gesetzt und es zählt nicht in die Statistik.</div>
    <div id="prev" class="small muted"></div>
    <div class="btns"><button class="btn primary" id="ok">Hinzufügen</button></div>`);
  let mode = "count";
  root.querySelectorAll("[data-m]").forEach(btn => btn.addEventListener("click", () => {
    mode = btn.dataset.m; root.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed", x===btn));
    root.querySelector("#mCount").hidden = mode!=="count"; root.querySelector("#mNames").hidden = mode!=="names"; root.querySelector("#mNotes").hidden = mode!=="notes"; upd();
  }));
  const parse = () => {
    if(mode==="count"){ const n=Math.min(parseInt(val(root,"iCount"))||0,300); return nextAutoNames(b.speciesId,n).map(name=>({name})); }
    if(mode==="names"){
      const raw = val(root,"iNames");
      return raw.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean).map(name=>({name}));
    }
    const rows = val(root,"iNotes").split("\n").map(l=>l.trim()).filter(Boolean);
    const autos = nextAutoNames(b.speciesId, rows.length); let ai = 0;
    return rows.map(l=>{
      const p = l.split(/[;\t|]/).map(s=>s.trim());
      const sx = (p[1]||"").toLowerCase();
      const sex = /^(m|männ|maenn|♂)/.test(sx)?"m":/^(w|f|weib|♀)/.test(sx)?"f":"u";
      const night = /nacht|night/i.test(p[3]||"");
      return {name:p[0]||autos[ai++], sex, burrow:parseDE((p[2]||"").replace(/[^\d.\-]/g,"")), eclose:parseDE((p[3]||"").replace(/[^\d.\-]/g,"")), night, bad:(p[2]&&!parseDE((p[2]||"").replace(/[^\d.\-]/g,"")))||(p[3]&&!parseDE((p[3]||"").replace(/[^\d.\-]/g,"")))};
    }).filter(x=>x.name);
  };
  const upd = () => { const L = parse(); const bad = L.filter(x=>x.bad).length;
    root.querySelector("#prev").innerHTML = L.length ? `${L.length} Tier(e): ${L.slice(0,6).map(x=>esc(x.name)).join(", ")}${L.length>6?" …":""}${mode==="notes"?` · ${L.filter(x=>x.burrow).length} mit Eingrabedatum, ${L.filter(x=>x.eclose).length} geschlüpft`:""}${bad?` · <b style="color:var(--crit)">${bad} Datum nicht erkannt</b>`:""}` : ""; };
  root.addEventListener("input", upd);
  root.querySelector("#iStage").addEventListener("change", e => { const v = e.target.value; root.querySelector("#iStageDW").hidden = root.querySelector("#iStageH").hidden = !v || v==="?"; });
  root.querySelector("#ok").addEventListener("click", async () => {
    const L = parse(); if(!L.length){ toast("Keine Tiere erkannt"); return; }
    const ex = mode==="notes" ? readExtra(root,"eingegraben") : {};
    if(ex._est && L.some(x=>x.burrow) && !(ex._estD>=0 && ex._estD<=365)){ toast("Bitte die Tage bis zur Verpuppung eintragen"); return; }
    const btn = root.querySelector("#ok"); btn.disabled = true; btn.textContent = "Speichere …";
    const cont = val(root,"iCont")||null; const sexAll = mode==="names" ? val(root,"iSex") : mode==="count" ? val(root,"iSexC") : null;
    const stK = val(root,"iStage"), stD = val(root,"iStageD");
    for(const x of L){
      const sex = sexAll || x.sex || "u";
      const iid = await store.put("individuals",{name:x.name, broodId:b.id, sex, containerId:cont, ...(stK==="?"?{startStage:"?"}:{})});
      if(stK && stK!=="?" && !x.burrow && !x.eclose){
        const real = stD ? ({vorpuppe:"eingegraben", puppe:"verpuppt", falter:"falterschlupf"})[stK] : (stK==="falter" ? "falterschlupf" : null);
        if(real) await store.put("events",{type:real, individualId:iid, broodId:b.id, ...makeTime("tag", stD||todayISO()), data:{}, note:stD?"beim Anlegen":"beim Anlegen, Datum unbekannt"});
        else await store.put("events",{type:"stadium", individualId:iid, broodId:b.id, ...makeTime("tag", stD||todayISO()), data:{to:stK}, note:stD?"beim Anlegen":"beim Anlegen, Datum unbekannt"});
      }
      if(x.burrow){ const bid = await store.put("events",{type:"eingegraben", individualId:iid, broodId:b.id, ...makeTime("tag",x.burrow), data:{}, note:"aus Notizen"}); if(ex._est) await addEstimatedPupation(S.individuals[iid], S.events[bid], ex._estD); }
      if(sex!=="u" && mode==="notes") await store.put("events",{type:"geschlecht", individualId:iid, broodId:b.id, ...makeTime("tag", x.burrow||todayISO()), data:{sex, at:"puppe"}, note:"aus Notizen"});
      if(x.eclose){
        const t = makeTime(x.night?"nacht":"tag", x.eclose);
        await store.put("events",{type:"falterschlupf", individualId:iid, broodId:b.id, ...t, data:{}, note:"aus Notizen"});
      }
    }
    if(mode==="notes" && L.some(x=>x.burrow) && S.species[b.speciesId]){ const sp = S.species[b.speciesId]; await store.put("species",{...sp, autoPupa:!!ex._est, ...(ex._est && prepupaDurations(sp.id).length<2 ? {prepupaDays:ex._estD} : {})}); }
    closeSheet(); toast(`${L.length} Tier(e) hinzugefügt`);
  });
};

/* ---- Tags ---- */
function tagFieldHtml(id, tags){
  const others = allTags();
  return `<div class="f"><label for="${id}">Tags</label><input id="${id}" value="${esc(tags.join(", "))}" placeholder="z. B. mini, dunkel, Zuchttier" autocomplete="off"></div>
    ${others.length?`<div class="chips" id="${id}Chips">${others.map(t=>`<button type="button" class="chip ${tags.includes(t)?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:""}
    <div class="hint">Mehrere durch Komma trennen. Tags erscheinen am Tier, in der Liste und lassen sich dort filtern.</div>`;
}
function wireTagField(root, id){
  const inp = root.querySelector("#"+id);
  root.querySelectorAll(`#${id}Chips [data-tag]`).forEach(b => b.addEventListener("click", () => {
    const cur = parseTags(inp.value); const t = b.dataset.tag;
    const nx = cur.includes(t) ? cur.filter(x=>x!==t) : [...cur, t];
    inp.value = nx.join(", "); b.classList.toggle("on", nx.includes(t));
  }));
}
ACTS.tagSheet = d => {
  const i = S.individuals[d.id]; if(!i) return;
  const root = openSheet(`<h2>Tags</h2><p class="muted" style="margin:-8px 0 0">${esc(i.name)}</p>${tagFieldHtml("tgIn", tagsOf(i))}<div class="btns"><button class="btn primary" id="ok">Speichern</button></div>`);
  wireTagField(root, "tgIn");
  root.querySelector("#ok").onclick = async () => { await store.put("individuals",{...S.individuals[i.id], tags:parseTags(val(root,"tgIn"))}); closeSheet(); };
};

/* ---- Ereignisse ---- */
function evExtraFields(type, d={}){
  switch(type){
    case "haeutung": return fld.sel("xTo","Neues Stadium",[["L2","L2"],["L3","L3"],["L4","L4"],["L5","L5"]],d.to||"L2");
    case "stadium": return fld.sel("xSt","Aktuelles Stadium",STAGES.map(s=>[s.k,s.l]),d.to||"L2")+fld.hint("Zum Korrigieren oder Nachtragen, wenn du nicht weißt, wann sich das Tier gehäutet hat.");
    case "eingegraben": {
      if(!d._new) return "";
      const df = estDefault(d._spId); const sp = S.species[d._spId];
      return `<label class="f" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="xEst" ${sp?.autoPupa===false?"":"checked"} style="width:20px;height:20px;min-height:0;flex:none"><span>Verpuppungsdatum automatisch schätzen</span></label>
      ${fld.num("xEstD","Tage vom Eingraben bis zur Verpuppung",df.days,"1")}
      <div class="hint">${df.src?esc(df.src)+". ":"Für diese Art gibt es noch keinen Wert: Trag deinen Richtwert ein, er wird für die Art gemerkt. "}Die Schätzung erscheint als „Verpuppt (geschätzt)“, zählt nicht in Puppenruhe und Prognose und lässt sich jederzeit korrigieren.</div>`;
    }
    case "verpuppt": return d.est ? `<label class="f" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="xIsEst" checked style="width:20px;height:20px;min-height:0;flex:none"><span>Datum ist nur geschätzt</span></label><div class="hint">Haken entfernen, sobald du das Datum sicher weißt. Dann zählt es auch in die Statistik.</div>` : "";
    case "geschlecht": return `<div class="frow2">${fld.sel("xSex","Geschlecht",[["f","Weibchen"],["m","Männchen"]],d.sex||"f")}${fld.sel("xAt","bestimmt an",[["puppe","Puppe"],["falter","Falter"],["raupe","Raupe"]],d.at||"puppe")}</div>`;
    case "gewicht": return fld.num("xG","Gewicht (g)",d.g??"","0.01");
    case "futter": return fld.text("xPlant","Futterpflanze",d.plant||"","z. B. Liguster");
    case "umgesetzt": return fld.sel("xCont","Neuer Behälter",contOpts(),d.containerId||"");
    case "tod": return `${fld.sel("xCause","Ursache",Object.entries(CAUSES),d.cause||"unbekannt")}${fld.sel("xCert","Wie sicher?",[["sicher","sicher"],["vermutet","Verdacht"]],d.certainty||"vermutet")}`;
    case "abgegeben": return fld.text("xTo2","An wen?",d.to||"");
    default: return "";
  }
}
function readExtra(root, type){
  switch(type){
    case "haeutung": return {to:val(root,"xTo")};
    case "eingegraben": { const c = root.querySelector("#xEst"); return c ? {_est:c.checked, _estD:parseInt(val(root,"xEstD"),10)} : {}; }
    case "stadium": return {to:val(root,"xSt")};
    case "geschlecht": return {sex:val(root,"xSex"), at:val(root,"xAt")};
    case "gewicht": return {g:parseFloat(val(root,"xG").replace(",","."))||null};
    case "futter": return {plant:val(root,"xPlant")};
    case "umgesetzt": return {containerId:val(root,"xCont")||null};

async function dissolveImago(m, indId){
  const ind = S.individuals[indId]; if(!ind){ await store.del("imagos", m.id); return; }
  for(const p of photosOf("imago", m.id)) await store.put("photos",{...p, subjectType:"individual", subjectId:indId});
  const patch = {};
  if(m.notes) patch.notes = [ind.notes, `Falter (${m.label}): ${m.notes}`].filter(Boolean).join("\n");
  if(m.sex && m.sex!=="u" && (!ind.sex || ind.sex==="u")) patch.sex = m.sex;
  if(Object.keys(patch).length) await store.put("individuals",{...ind, ...patch});
  const map = {"tot":"tod","präpariert":"praepariert","freigelassen":"freigelassen"};
  const et = map[m.state];
  if(et && !evOf(indId).some(e=>e.type===et)) await store.put("events",{type:et, individualId:indId, broodId:ind.broodId, ...makeTime("tag", todayISO()), data: et==="tod"?{cause:"unbekannt", certainty:"vermutet", stage:"falter"}:{}, note:"vom Falter-Eintrag übernommen"});
  await store.del("imagos", m.id);
}
ACTS.assign = async d => {
  const m = S.imagos[d.id]; if(!m) return;
  const done = [`${m.label} = ${indName(d.ind)}`];
  let pending = [[m, d.ind]];
  while(pending.length){
    const [x, indId] = pending.shift();
    const batch = x.batchId;
    await dissolveImago(x, indId);
    if(!batch) continue;
    for(const y of openImagos().filter(y=>y.batchId===batch && !pending.some(p=>p[0].id===y.id))){
      const c = (y.candidates||[]).filter(id=>id!==indId && S.individuals[id]);
      if(c.length===1){ pending.push([y, c[0]]); done.push(`${y.label} = ${indName(c[0])}`); }
      else await store.put("imagos",{...y, candidates:c});
    }
  }
  toast(done.length>1 ? `Zugeordnet: ${done.join(", ")}` : `Zugeordnet: ${done[0]}`);
  tab(openImagos().length ? "imagos" : "home"); if(!openImagos().length) nav("animal",{id:d.ind});
};

function parseClimateCsv(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const delim = [";","\t",","].map(c=>[c,(lines[0].match(new RegExp(c==="\t"?"\t":"\\"+c,"g"))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const out = [];
  for(const l of lines){
    const c = l.split(delim).map(s=>s.trim().replace(/^"|"$/g,""));
    let m = c[0].match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})/) || null, date, time;
    if(m){ date=`${m[1]}-${m[2]}-${m[3]}`; time=`${pad(+m[4])}:${m[5]}`; }
    else { m = c[0].match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})[ ,]+(\d{1,2}):(\d{2})/); if(m){ let y=+m[3]; if(y<100)y+=2000; date=`${y}-${pad(+m[2])}-${pad(+m[1])}`; time=`${pad(+m[4])}:${m[5]}`; } }
    if(!date) continue;
    let rest = c.slice(1);
    if(rest.length && /^\d{1,2}:\d{2}/.test(rest[0])) rest = rest.slice(1);
    const nums = rest.map(s=>parseFloat(s.replace(",","."))).filter(Number.isFinite);
    if(!nums.length) continue;
    out.push({date, time, temp:nums[0]??null, rh:nums[1]??null});
  }
  // auf 10-Minuten-Mittel verdichten
  const b = new Map();
  for(const p of out){ const t = `${p.time.slice(0,3)}${String(Math.floor(+p.time.slice(3)/10)*10).padStart(2,"0")}`; const k = p.date+" "+t;
    const x = b.get(k) || {date:p.date, time:t, ts:0, tn:0, hs:0, hn:0}; if(p.temp!=null){x.ts+=p.temp;x.tn++;} if(p.rh!=null){x.hs+=p.rh;x.hn++;} b.set(k,x); }

const BT_SVC = "ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6", BT_CHR = "ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6";
const withTimeout = (p, ms, msg="Zeitüberschreitung") => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)), ms))]);
function sensorCard(l){
  if(!navigator.bluetooth) return `<div class="note">Bluetooth-Sensor: In diesem Browser nicht verfügbar. Öffne das Raupenbuch in Chrome auf Android.</div>`;
  const sn = l.sensor;
  if(!sn) return `<div class="card sensor"><b>Bluetooth-Sensor</b><span class="small muted">Koppel einen Xiaomi-Hygrometer (LYWSD03MMC) mit diesem Standort. Danach holst du den aktuellen Wert mit einem Tippen.</span><div class="btns"><button class="btn primary" data-act="sensorRead" data-loc="${l.id}" data-new="1">Sensor koppeln</button></div></div>`;
  const batt = sn.mv ? `${fmtN(sn.mv/1000,2)} V` : "";
  return `<div class="card sensor"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>Sensor ${esc(sn.name||"")}</b>${batt?`<span class="pill ${sn.mv<2500?"warn":""}">Batterie ${batt}</span>`:""}</div>
    ${sn.last?`<div class="vals"><span>${fmtN(sn.last.temp,1)} °C</span><span>${fmtN(sn.last.rh,0)} %</span></div><span class="small muted">abgerufen ${dDE(sn.last.at)} ${sn.last.at.slice(11,16)}</span>`:""}
    <div class="btns"><button class="btn primary" data-act="sensorRead" data-loc="${l.id}">Messwert vom Sensor holen</button><button class="btn ghost" data-act="sensorMenu" data-loc="${l.id}">Sensor ändern</button></div></div>`;
}
async function btPick(){
  return await navigator.bluetooth.requestDevice({filters:[{namePrefix:"LYWSD03"},{namePrefix:"ATC_"},{services:[BT_SVC]}], optionalServices:[BT_SVC]});
}
async function btKnown(id){
  if(!id || !navigator.bluetooth.getDevices) return null;
  try { const ds = await navigator.bluetooth.getDevices(); return ds.find(d=>d.id===id) || null; } catch(e){ return null; }
}
async function btWaitAdv(dev, ms){
  if(!dev.watchAdvertisements) return;
  const ac = new AbortController();
  await new Promise(res => {
    const t = setTimeout(res, ms);
    dev.addEventListener("advertisementreceived", () => { clearTimeout(t); res(); }, {once:true});
    dev.watchAdvertisements({signal:ac.signal}).catch(() => { clearTimeout(t); res(); });
  });
  ac.abort();
}
async function btRead(dev, say){
  let srv = null, err = null;
  for(let a=1; a<=3 && !srv; a++){
    try { say(a===1?"Verbinde …":`Verbinde (Versuch ${a}) …`); srv = await withTimeout(dev.gatt.connect(), 15000, "Sensor antwortet nicht"); }
    catch(e){ err = e; if(a===1){ say("Suche Sensor in der Nähe …"); await btWaitAdv(dev, 8000); } }
  }
  if(!srv) throw err || new Error("Keine Verbindung");
  try {
    const ch = await (await srv.getPrimaryService(BT_SVC)).getCharacteristic(BT_CHR);
    say("Warte auf Messwert …");
    const v = await withTimeout(new Promise((res, rej) => {
      ch.addEventListener("characteristicvaluechanged", ev => res(ev.target.value), {once:true});
      ch.startNotifications().catch(rej);
    }), 25000, "Kein Messwert empfangen");
    try { await ch.stopNotifications(); } catch(e){}
    return {temp: Math.round(v.getInt16(0,true))/100, rh: v.getUint8(2), mv: v.byteLength>=5 ? v.getUint16(3,true) : null};
  } finally { try { dev.gatt.disconnect(); } catch(e){} }
}

function qrSvg(code){
  const qr = qrcode(0,"M"); qr.addData(code); qr.make();
  const n = qr.getModuleCount(); let d = "";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><path d="${d}" fill="#000"/></svg>`;
}
function printLabels(items, fmt){
  const cols = fmt==="k"?4:3, rows = fmt==="k"?10:7, per = cols*rows;
  const pd = fmt==="k"?2.5:3.5;
  const fs = fmt==="k"?{t:10,s:6.5,c:5}:{t:13,s:8,c:6};
  let html = "";
  for(let p=0; p<items.length; p+=per){
    html += `<div class="pp" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`;
    html += items.slice(p,p+per).map(it=>`<div class="lb" style="padding:${pd}mm">${qrSvg(it.code)}<div class="tx"><b style="font-size:${fs.t}pt">${esc(it.title)}</b>${it.l2?`<${it.it?"i":"span"} style="font-size:${fs.s}pt">${esc(it.l2)}</${it.it?"i":"span"}>`:""}${it.l3?`<span style="font-size:${fs.s}pt">${esc(it.l3)}</span>`:""}<code style="font-size:${fs.c}pt">${esc(it.code)}</code></div></div>`).join("");
    html += `</div>`;
  }
  $("#printArea").innerHTML = html;
  setTimeout(() => { window.print(); }, 50);
}
window.addEventListener("afterprint", () => { const pa = $("#printArea"); if(pa) pa.innerHTML = ""; });
function labelText(i){
  const b = S.broods[i.broodId]; const sp = speciesOfBrood(b);
  return {title:i.name, l2:sp?.sci||"", l3:`${b?.name||""}${i.sex&&i.sex!=="u"?" · "+tr(SEXL[i.sex]):""}`, it:true};
}
function makeLabelPdf(items, fmt){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const cols = fmt==="k"?4:3, rows = fmt==="k"?10:7;
  const W = 210/cols, H = 297/rows, per = cols*rows;
  items.forEach((it, n) => {
    if(n && n%per===0) doc.addPage();
    const k = n%per, x = (k%cols)*W, y = Math.floor(k/cols)*H;
    doc.setDrawColor(200); doc.setLineWidth(0.1); doc.setLineDashPattern([1,1.5],0); doc.rect(x, y, W, H); doc.setLineDashPattern([],0);
    const pd = fmt==="k"?2.5:3.5, qs = H - 2*pd;
    const qr = qrcode(0,"M"); qr.addData(it.code); qr.make();
    const cnt = qr.getModuleCount(), m = qs/cnt;
    doc.setFillColor(0,0,0);
    for(let r=0;r<cnt;r++) for(let c=0;c<cnt;c++) if(qr.isDark(r,c)) doc.rect(x+pd+c*m, y+pd+r*m, m+0.02, m+0.02, "F");
    const tx = x+pd+qs+2.5, tw = W-(qs+pd*2+2.5);
    let ty = y+pd+ (fmt==="k"?3.6:4.6);
    doc.setTextColor(0); doc.setFont("helvetica","bold"); doc.setFontSize(fmt==="k"?10:13);
    doc.splitTextToSize(it.title, tw).slice(0,2).forEach(t=>{ doc.text(t, tx, ty); ty += fmt==="k"?4:5; });
    doc.setFont("helvetica", it.it?"italic":"normal"); doc.setFontSize(fmt==="k"?6.5:8);
    if(it.l2){ doc.splitTextToSize(it.l2, tw).slice(0,1).forEach(t=>{ doc.text(t, tx, ty); ty += 3.4; }); }
    doc.setFont("helvetica","normal");
    if(it.l3){ doc.splitTextToSize(it.l3, tw).slice(0,2).forEach(t=>{ doc.text(t, tx, ty); ty += 3.4; }); }
    doc.setFont("courier","normal"); doc.setFontSize(fmt==="k"?5:6); doc.setTextColor(90);
    doc.text(it.code, tx, y+H-pd);
  });
  return doc.output("blob");
}

ACTS.scan = () => {

  const root = openSheet(`<h2>Etikett scannen</h2>
    ${canLive?`<div class="scanbox" id="sbox" hidden><video id="sv" playsinline muted></video><div class="aim"></div></div>

  const st = root.querySelector("#sst");
  let stream = null, timer = null, busy = false, det = null, cnv = null;
  const stop = () => { clearTimeout(timer); timer = null; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } };
  _sheetCleanup = stop;
  const found = code => { if(openCode(code)) return true; st.textContent = `Code „${code}“ gehört zu keinem Eintrag.`; return false; };
  async function tick(){
    const v = root.querySelector("#sv"); if(!stream || !v) return;
    if(!busy && v.readyState >= 2 && v.videoWidth){
      busy = true;
      try {
        let code = null;
        if(det){ try { const r = await det.detect(v); if(r[0]) code = r[0].rawValue; } catch(e){ det = null; } }
        if(!code && !det){
          await loadLib("jsqr");
          const sc = Math.min(1, 720/Math.max(v.videoWidth, v.videoHeight));
          cnv ||= document.createElement("canvas"); cnv.width = Math.round(v.videoWidth*sc); cnv.height = Math.round(v.videoHeight*sc);
          const ctx = cnv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(v,0,0,cnv.width,cnv.height);
          const r = jsQR(ctx.getImageData(0,0,cnv.width,cnv.height).data, cnv.width, cnv.height, {inversionAttempts:"dontInvert"});
          if(r) code = r.data;
        }
        if(code && /^RB:/.test(code)){ if(navigator.vibrate) navigator.vibrate(60); if(found(code)) { stop(); return; } }
      } finally { busy = false; }
    }
    timer = setTimeout(tick, 200);
  }
  const lb = root.querySelector("#live");
  if(lb) lb.onclick = async () => {
    try {
      st.textContent = "Starte Kamera …";
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:960}}, audio:false});
      const v = root.querySelector("#sv"); v.srcObject = stream; await v.play();
      root.querySelector("#sbox").hidden = false; lb.hidden = true;
      st.textContent = "Halte den QR-Code in den Rahmen …";
      if("BarcodeDetector" in window){ try { const f = await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")) det = new BarcodeDetector({formats:["qr_code"]}); } catch(e){} }
      tick();
    } catch(e){
      stop();
      st.textContent = e && e.name==="NotAllowedError" ? "Kamera nicht erlaubt. Erlaube sie in den Website-Einstellungen oder nimm ein Foto." : "Kamera nicht verfügbar: " + (e.message||e.name||e);
    }
  };
  const sf = root.querySelector("#sf");
  sf.onchange = async () => {
    const f = sf.files[0]; if(!f) return; stop(); st.textContent = "Suche QR-Code …";
    try { const code = await decodeQr(f); if(!code){ st.textContent = "Kein QR-Code erkannt. Näher ran, scharf stellen und gerade halten."; return; } found(code); }
    catch(e){ st.textContent = "Scannen fehlgeschlagen: " + (e.message||e); }
    sf.value = "";
  };
  root.querySelector("#go").onclick = () => { const c = val(root,"sCode"); if(!openCode(c.startsWith("RB:")?c:`RB:i:${c}`)) toast("Kein Eintrag mit diesem Code"); };
  if(lb) lb.click();
};
async function decodeQr(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    for(const max of [1000, 1600, 600]){
      const sc = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
      const ctx = c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(img,0,0,c.width,c.height);
      if("BarcodeDetector" in window){ try { const r = await new BarcodeDetector({formats:["qr_code"]}).detect(c); if(r[0]) return r[0].rawValue; } catch(e){} }
      await loadLib("jsqr");
      const id = ctx.getImageData(0,0,c.width,c.height);
      const r = jsQR(id.data, c.width, c.height, {inversionAttempts:"attemptBoth"}); if(r) return r.data;
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
function openCode(code){
  const m = String(code||"").trim().match(/^RB:([ic]):(.+)$/); if(!m) return false;
  if(m[1]==="i" && S.individuals[m[2]]){ closeSheet(); nav("animal",{id:m[2]}); return true; }
  if(m[1]==="c" && S.containers[m[2]]){ closeSheet(); ACTS.editContainer({id:m[2]}); return true; }
  return false;
}

/* ---- Export / Import ---- */
const blobToDataUrl = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); });
async function dataUrlToBlob(u){ return await (await fetch(u)).blob(); }
ACTS.exportJson = async () => {
  const say = t => { R.exMsg = t; const st = $("#exst"); if(st) st.textContent = t; };
  try {
    say("Erstelle Backup …");
    const parts = [`{"app":"raupenbuch","version":2,"appVersion":${JSON.stringify(APP_VERSION)},"exportedAt":${JSON.stringify(new Date().toISOString())},"data":`, JSON.stringify(S), `,"blobs":{`];
    const ids = [...new Set(all("photos").map(p=>p.blobId).filter(Boolean))];
    let first = true, k = 0;
    for(const id of ids){
      const b = await store.getBlob(id); k++; say(`Fotos ${k}/${ids.length} …`);
      if(!b) continue;
      parts.push((first?"":",") + JSON.stringify(id) + ":" + JSON.stringify(await blobToDataUrl(b))); first = false;
    }
    parts.push("}}");
    const ok = await store.save(`raupenbuch-backup-${todayISO()}.json`, new Blob(parts, {type:"application/json"}));
    if(ok){ await store.setMeta("lastBackup", nowLocal()); say(`Backup mit ${ids.length} Foto(s) gespeichert. Prüfe den Download-Ordner.`); render(); }
  } catch(e){ console.error(e); say(""); toast("Backup fehlgeschlagen: " + (e.message||e)); }
};
ACTS.exportCsv = () => {
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const head = LANG==="en" ? ["Name","Brood","Species","Sex","Status","Stage","Burrowed","Pupated","Eclosed","Pupal period (days)","Died","Cause","Tags","Notes"]
    : ["Name","Zuchtansatz","Art","Geschlecht","Status","Stadium","Eingegraben","Verpuppt","Geschlüpft","Puppenruhe (Tage)","Gestorben","Ursache","Tags","Notizen"];
  const rows = all("individuals").sort(byName).map(i=>{
    const b=S.broods[i.broodId], sp=speciesOfBrood(b), eg=firstEv(i,"eingegraben"), vp=realPupation(i)||firstEv(i,"verpuppt"), ec=firstEv(i,"falterschlupf"), d=deathOf(i), st=pupalStart(i);
    return [i.name,b?.name,sp?.sci,tr(SEXL[i.sex||"u"]),tr(statusOf(i)),tr(stageLabel(currentStage(i))),eg&&fmtTime(eg),vp&&(fmtTime(vp)+(vp.data?.est?(LANG==="en"?" (estimated)":" (geschätzt)"):"")),ec&&fmtTime(ec),st&&ec?daysBetween(st.ev,ec):"",d&&fmtTime(d),d&&tr(CAUSES[d.data?.cause]||""),tagsOf(i).join(", "),i.notes].map(q).join(";");
  });
  store.save(`raupenbuch-tiere-${todayISO()}.csv`, "﻿"+[head.map(q).join(";"),...rows].join("\r\n"));
};
document.addEventListener("change", async e => {
  if(e.target.id!=="fileJson") return;
  const f = e.target.files[0]; if(!f) return; e.target.value="";
  const say = t => { R.imMsg = t; const st = $("#imst"); if(st) st.textContent = t; };
  let o; try { say("Lese Datei …"); o = JSON.parse(await f.text()); } catch(err){ say(""); toast("Datei ist kein gültiges JSON"); return; }
  if(o.app!=="raupenbuch" || !o.data){ say(""); toast("Das ist keine Raupenbuch-Sicherung"); return; }
  try { await importBackup(o, R.impMode==="replace", say); } catch(err){ console.error(err); toast("Import fehlgeschlagen: " + (err.message||err)); }
});
async function importBackup(o, replace, say=()=>{}){
  if(replace){
    say("Lösche bisherige Daten …");
    for(const c of COLS){ for(const id of Object.keys(S[c])){ if(c==="photos") await store.deletePhotoAsset(S[c][id]); await store.del(c, id); } }
  }
  const blobs = o.blobs || {};
  let k = 0; const bids = Object.keys(blobs);
  for(const id of bids){ k++; if(k%5===0) say(`Fotos ${k}/${bids.length} …`); try { await store.putBlob(id, await dataUrlToBlob(blobs[id])); } catch(e){ console.warn("Foto", id, e); } }
  let n = 0, missing = 0; const total = COLS.reduce((a,c)=>a+Object.keys(o.data[c]||{}).length,0);
  for(const c of COLS) for(const [key, d0] of Object.entries(o.data[c]||{})){
    const doc = {...d0, id: d0.id || key};
    if(c==="photos"){
      if(doc.dataUrl){ doc.blobId = "b"+uid(); await store.putBlob(doc.blobId, await dataUrlToBlob(doc.dataUrl)); delete doc.dataUrl; }
      if(doc.assetId && !doc.blobId && store.urls.has(doc.assetId)) doc.blobId = doc.assetId;
      if(!doc.blobId || !store.urls.has(doc.blobId)) missing++;
      delete doc.assetId;
    }
    await store.putRaw(c, doc); n++;
    if(n%25===0) say(`Importiere … ${n}/${total}`);
  }
  _evIdx = null; _migrated = false;
  say(`${n} Einträge und ${bids.length} Foto(s) importiert.${missing?` ${missing} Foto(s) ohne Bilddatei.`:""}`);
  toast(`${n} Einträge importiert`);
  scheduleRender();
}

/* Service Worker: offline-first, Update-Hinweis bei neuer Version */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("sw.js", {updateViaCache:"none"});
      const offer = w => {
        if(!w || $(".update")) return;
        const el = document.createElement("div"); el.className = "update"; el.setAttribute("role","status");
        el.innerHTML = `<span class="small">Neue Version verfügbar</span><button class="btn">Aktualisieren</button>`;
        el.querySelector("button").onclick = () => { w.postMessage("skipWaiting"); el.remove(); };
        document.body.appendChild(el);
      };
      if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => { if(w.state === "installed" && navigator.serviceWorker.controller) offer(w); });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if(reloading) return; reloading = true; location.reload(); });
      document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") reg.update().catch(()=>{}); });
    } catch(e){ console.warn("SW", e); }
  });
}
