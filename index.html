<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raupenbuch</title>
<meta name="description" content="Zuchttagebuch für Raupen und Falter – offline auf deinem Gerät.">
<meta name="theme-color" content="#F2EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-style:normal;font-weight:600;font-display:swap;src:url(spectral-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-style:italic;font-weight:400;font-display:swap;src:url(spectral-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-style:italic;font-weight:600;font-display:swap;src:url(spectral-latin-600-italic.woff2) format("woff2")}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one-column field notebook, sticky top bar, fixed bottom tab bar; records look like specimen labels */
:root{
  --bg:#ECEEE7; --surface:#F8F9F4; --sunk:#E2E5DC; --ink:#1C1F1A; --muted:#5B6157; --line:#CDD2C5;
  --accent:#2F5276; --accent-ink:#FFFFFF; --accent-soft:#D9E3EE;
  --ochre:#8A6200; --ochre-soft:#F2E4BC;
  --good:#356231; --good-soft:#DCEAD6; --warn:#8A5A00; --warn-soft:#F5E3BF; --crit:#A0362A; --crit-soft:#F4D9D3;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-name:"Spectral",Georgia,"Times New Roman",serif;
  --r:10px; --gut:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1E1B; --sunk:#232824; --ink:#E5E8E0; --muted:#9BA196; --line:#30362F;
  --accent:#8EB0D8; --accent-ink:#0F1A26; --accent-soft:#1F2D3D;
  --ochre:#E2B547; --ochre-soft:#3A3018;
  --good:#86BC7C; --good-soft:#1E2E1C; --warn:#E2B547; --warn-soft:#3A3018; --crit:#E8806D; --crit-soft:#3D221D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --sunk:#232824; --ink:#E5E8E0; --muted:#9BA196; --line:#30362F;
  --accent:#8EB0D8; --accent-ink:#0F1A26; --accent-soft:#1F2D3D;
  --ochre:#E2B547; --ochre-soft:#3A3018;
  --good:#86BC7C; --good-soft:#1E2E1C; --warn:#E2B547; --warn-soft:#3A3018; --crit:#E8806D; --crit-soft:#3D221D;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
.sp{font-family:var(--f-name);font-style:italic}
.mono,.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px var(--gut)}
.top .brand{font-family:var(--f-name);font-weight:600;font-size:20px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{font-family:var(--f-data);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.backbtn{appearance:none;border:0;background:none;padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:500}
.backbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

main{padding:14px var(--gut) calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;border-radius:8px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font-size:12px;font-family:var(--f-data);font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h .link{font-size:13px}
.pagehead{display:flex;flex-direction:column;gap:6px}
.pagehead h1{font-family:var(--f-name);font-weight:600;font-size:30px}
.pagehead .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* specimen-label card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{appearance:none;border:0;background:none;text-align:left;width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;min-height:52px}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;gap:6px;align-items:center;flex:none}
.row.static{cursor:default}
.row.static:hover{background:none}
.empty{padding:18px 14px;color:var(--muted);text-align:left;font-size:14px;line-height:1.5}
.empty b{color:var(--ink)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-family:var(--f-data);line-height:20px;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.pill.stage{background:var(--accent-soft);color:var(--accent)}
.pill.falter{background:var(--ochre-soft);color:var(--ochre)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.sex{font-family:var(--f-data);font-weight:500;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px;flex:none;background:var(--sunk);color:var(--muted)}
.sex.f{background:var(--crit-soft);color:var(--crit)}
.sex.m{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:8px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.quick .btn{border-radius:var(--r);justify-content:flex-start;padding:10px 12px;min-height:48px;text-align:left}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--f-data);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:8px;font-size:13px}
.frow .lbl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{height:14px;border-radius:4px;background:var(--sunk);display:flex;overflow:hidden}
.fbar i{display:block;height:100%}
.fbar .r{background:var(--good)}
.fbar .p{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px)}
.fbar .l{background:var(--crit)}
.frow .v{font-family:var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:0;appearance:none;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.tl .dot{position:relative}
.tl .dot::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .ev:first-child .dot::before{top:14px}
.tl .ev:last-child .dot::before{bottom:calc(100% - 14px)}
.tl .dot::after{content:"";position:absolute;left:3px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .ev.stagechg .dot::after{background:var(--accent)}
.tl .ev.death .dot::after{border-color:var(--crit);background:var(--crit)}
.tl .ev.est .dot::after{border-style:dashed;background:var(--surface)}
.tl .ev.est .x{font-style:italic;color:var(--muted)}
.tl .ev.falter .dot::after{border-color:var(--ochre);background:var(--ochre)}
.tl .body{padding:5px 0 12px;min-width:0}
.tl .body .w{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.tl .body .x{font-weight:500}
.tl .body .n{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);border:0;padding:0;cursor:pointer;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;font-family:var(--f-data);padding:0 5px;border-radius:4px}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:13px}
.compare{display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding-bottom:6px}
.compare .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.compare .col h3{font-size:14px}
.compare img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--sunk)}
.compare .noimg{aspect-ratio:4/5;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}

/* chips/segmented */
.seg{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;padding:10px 0}

/* callouts */
.note{border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--warn-soft)}
.uncertain{border:1.5px dashed var(--ochre);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}

/* forecast */
.fc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.fc .win{font-family:var(--f-data);font-size:13px}
.track{grid-column:1/-1;position:relative;height:8px;background:var(--sunk);border-radius:4px;margin-top:6px}
.track .w{position:absolute;top:0;bottom:0;background:var(--ochre-soft);border:1px solid var(--ochre);border-radius:4px}
.track .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-data);font-size:10px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 28px;gap:8px;align-items:center;font-size:13px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track2{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar .track2 i{display:block;height:100%;background:var(--crit)}
.bar .track2 i.v{background:repeating-linear-gradient(135deg,var(--crit) 0 3px,var(--crit-soft) 3px 6px)}
.bar .v{font-family:var(--f-data);text-align:right}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:6px;border-bottom:1px solid var(--line);font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.t td:first-child{font-family:var(--f-body)}
.tw{overflow-x:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px var(--gut) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-name);font-weight:600;font-size:22px}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.f .lab{font-size:13px;font-weight:500;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
.f textarea{min-height:90px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto}
.checks label{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink);font-weight:400}
.checks label:first-child{border-top:0}
.checks input{width:20px;height:20px;min-height:0;flex:none}
.confirm{border:1px solid var(--crit);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--crit-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .bar2{display:flex;gap:8px;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap}
.viewer .btn{background:#222;color:#fff;border-color:#444}
.spin{opacity:.6}
.filebtn{position:relative;overflow:hidden}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.frow{grid-template-columns:80px 1fr 56px}}

/* PWA-Ergänzungen */
.scanbox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .aim{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.backup{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.backup.due{border-color:var(--warn);background:var(--warn-soft)}
.sensor{display:flex;flex-direction:column;gap:8px}
.sensor .vals{display:flex;gap:14px;font-family:var(--f-data);font-size:20px}
.pill.tag{background:transparent;border:1px solid var(--ochre);color:var(--ochre);font-weight:500}
button.pill.tag{cursor:pointer}
.pill.tag.add{border-style:dashed;color:var(--muted);border-color:var(--line)}
.tagmini{font-family:var(--f-data);font-size:12px;font-weight:500;color:var(--ochre);margin-left:6px}
.update{position:fixed;left:var(--gut);right:var(--gut);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:61;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto}
.update .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);min-height:34px;padding:6px 12px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  body>*:not(#printArea){display:none!important}
  html,body{background:#fff!important}
  #printArea{display:block!important;color:#000;font-family:Helvetica,Arial,sans-serif}
  .pp{width:210mm;height:297mm;display:grid;page-break-after:always;break-after:page;overflow:hidden}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .lb{border:.1mm dashed #bbb;display:flex;gap:2.5mm;align-items:stretch;overflow:hidden}
  .lb svg{flex:none;height:100%;width:auto}
  .lb .tx{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .lb b{font-weight:700;line-height:1.15}
  .lb i,.lb span{line-height:1.25}
  .lb code{margin-top:auto;font-family:Courier,monospace;color:#555}
}

/* ===== Look 2: Feldbuch, lebendiger ===== */
:root{
  --bg:#F2EFE7; --surface:#FFFDF8; --sunk:#E9E5DA; --ink:#1F1D18; --muted:#6A6455; --line:#E2DDD0;
  --accent:#2F5E4D; --accent-ink:#FFFFFF; --accent-soft:#DDEBE3;
  --ochre:#9A6410; --ochre-soft:#F5E6C6;

function tr(s){
  if(LANG==="de" || s==null) return s;
  const t = String(s).trim(); if(!t) return s;
  if(Object.prototype.hasOwnProperty.call(I18N_EN, t)) return String(s).replace(t, I18N_EN[t]);
  if(!/[A-Za-zÄÖÜäöüß]/.test(t)) return s;
  for(const [rx, rep] of I18N_RX){ if(rx.test(t)) return String(s).replace(t, t.replace(rx, rep)); }
  if(t.startsWith("· ")){ const r = tr(t.slice(2)); if(r!==t.slice(2)) return String(s).replace(t, "· "+r); }
  if(t.includes(" · ")){ const parts = t.split(" · "); const out = parts.map(p=>tr(p)); if(out.some((x,i)=>x!==parts[i])) return String(s).replace(t, out.join(" · ")); }
  return s;
}
const I18N_ATTRS = ["placeholder","aria-label","title","alt"];
function translateNode(node){
  if(LANG==="de") return;
  if(node.nodeType===3){ const p = node.parentElement; if(p && p.closest("script,style")) return; const v = tr(node.data); if(v!==node.data) node.data = v; return; }
  if(node.nodeType!==1 || node.matches("script,style")) return;
  const els = [node, ...node.querySelectorAll("*")];
  for(const el of els) for(const a of I18N_ATTRS){ const v = el.getAttribute(a); if(v){ const t = tr(v); if(t!==v) el.setAttribute(a, t); } }
  const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT); let n;
  while((n = w.nextNode())){ if(n.parentElement?.closest("script,style")) continue; const v = tr(n.data); if(v!==n.data) n.data = v; }
}
new MutationObserver(ms => { if(LANG==="de") return; for(const m of ms) for(const n of m.addedNodes) translateNode(n); })
  .observe(document.documentElement, {childList:true, subtree:true});

/* Zeitangaben: t0 [t1] prec */
function makeTime(prec, date, time, dateTo){
  if(prec==="exakt") return {t0:`${date}T${time||"12:00"}`, t1:null, prec};
  if(prec==="nacht") return {t0:`${date}T20:00`, t1:`${addDays(date,1)}T08:00`, prec};
  if(prec==="zeitraum") return {t0:`${date}T00:00`, t1:`${(dateTo&&dateTo>=date?dateTo:date)}T23:59`, prec};
  return {t0:`${date}T12:00`, t1:null, prec:"tag"};
}
function evMid(e){ const a=ms(e.t0); const b=e.t1?ms(e.t1):a; return (a+b)/2; }
function fmtTime(e){
  if(!e||!e.t0) return "–";
  const d0=e.t0.slice(0,10);
  if(e.prec==="exakt") return `${dDE(d0)} ${e.t0.slice(11,16)}`;
  if(e.prec==="nacht"){ const d1=e.t1.slice(0,10); return `Nacht ${dShort(d0).slice(0,3)}/${dDE(d1)}`; }
  if(e.prec==="zeitraum"){ const d1=e.t1.slice(0,10); return d0===d1? dDE(d0) : `${dShort(d0)}–${dDE(d1)}`; }
  return dDE(d0);
}
const daysBetween = (a,b) => Math.round((evMid(b)-evMid(a))/864e5);

/* Automatische Namen: "A. atropos 01" je Art fortlaufend */
function speciesShort(sp){ if(!sp) return "Tier"; const p=(sp.sci||"").split(/\s+/); return p.length>1 ? `${p[0][0]}. ${p.slice(1).join(" ")}` : (sp.sci||"Tier"); }
function nextAutoNames(speciesId, n){
  const sp = S.species[speciesId]; const pre = speciesShort(sp);
  const re = new RegExp("^"+pre.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+" (\\d+)$");
  let mx = 0; for(const i of Object.values(S.individuals)){ const m=(i.name||"").match(re); if(m) mx=Math.max(mx,+m[1]); }
  return Array.from({length:Math.max(0,n)},(_,k)=>`${pre} ${String(mx+k+1).padStart(2,"0")}`);
}

const speciesOfBrood = b => b && S.species[b.speciesId];
const speciesOfInd = i => speciesOfBrood(S.broods[i.broodId]);
let _evIdx = null;
function evIndex(){
  if(_evIdx) return _evIdx;
  _evIdx = {ind:{}, cont:{}, brood:{}};
  for(const e of all("events")){
    const k = e.individualId? ["ind",e.individualId] : e.containerId? ["cont",e.containerId] : ["brood",e.broodId];
    (_evIdx[k[0]][k[1]] ||= []).push(e);
  }
  for(const m of Object.values(_evIdx)) for(const k in m) m[k].sort((a,b)=>ms(a.t0)-ms(b.t0) || (a.createdAt||"").localeCompare(b.createdAt||""));
  return _evIdx;
}
const evOf = indId => evIndex().ind[indId] || [];
const evIsDue = e => (e.t0||"").slice(0,10) <= todayISO();
function stageEventsOf(ind){ return evOf(ind.id).filter(e=>ET[e.type]?.stage && ET[e.type].stage(e.data||{}) && evIsDue(e)); }
function currentStage(ind){
  const se = stageEventsOf(ind);
  if(se.length){ const e=se[se.length-1]; return ET[e.type].stage(e.data||{}); }
  return startStageOf(ind);
}
function maxStageIdx(ind){
  let m = SIDX[startStageOf(ind)] ?? 1;
  for(const e of stageEventsOf(ind)) m = Math.max(m, SIDX[ET[e.type].stage(e.data||{})] ?? 0);
  return m;
}
function statusOf(ind){
  const ev = evOf(ind.id);
  if(ev.some(e=>e.type==="praepariert")) return "praepariert";
  if(ev.some(e=>e.type==="tod")) return "tot";
  if(ev.some(e=>e.type==="abgegeben")) return "abgegeben";
  if(ev.some(e=>e.type==="freigelassen")) return "freigelassen";
  return "aktiv";
}
const deathOf = ind => evOf(ind.id).find(e=>e.type==="tod");
const isAlive = ind => statusOf(ind)==="aktiv";
const firstEv = (ind,type) => evOf(ind.id).find(e=>e.type===type);

/* Puppenruhe & Prognose
   Geschätzte Verpuppungen (data.est) zählen nie in Statistik oder Prognose: dort wird dann ab Eingraben gerechnet. */
const realPupation = ind => evOf(ind.id).find(e=>e.type==="verpuppt" && !e.data?.est);
const estPupations = ind => evOf(ind.id).filter(e=>e.type==="verpuppt" && e.data?.est);
function prepupaDurations(spId){
  const v=[];
  for(const ind of all("individuals")){ if(speciesOfInd(ind)?.id!==spId) continue; const b=firstEv(ind,"eingegraben"), pu=realPupation(ind); if(b&&pu) v.push(daysBetween(b,pu)); }
  return v;
}
function estDefault(spId){
  const v = prepupaDurations(spId);
  if(v.length>=2) return {days:Math.round(median(v)), src:`Median aus ${v.length} deiner Tiere mit sicherem Verpuppungsdatum`};
  const sp = S.species[spId];
  if(sp?.prepupaDays) return {days:sp.prepupaDays, src:`Richtwert der Art${v.length?` (erst ${v.length} eigener Wert)`:""}`};
  return {days:"", src:""};
}
async function addEstimatedPupation(ind, burrowEv, days){
  for(const e of estPupations(ind)) await store.del("events", e.id);
  if(realPupation(ind)) return;
  const base = dFromMs(evMid(burrowEv));
  await store.put("events",{type:"verpuppt", individualId:ind.id, broodId:ind.broodId, ...makeTime("tag", addDays(base, days)), data:{est:true, days, fromEv:burrowEv.id}, note:`geschätzt: Eingraben + ${days} Tage`});
}
function pupalStart(ind){
  const p=realPupation(ind); if(p) return {ev:p, basis:"verpuppt"};
  const b=firstEv(ind,"eingegraben"); if(b) return {ev:b, basis:"eingegraben"};
  return null;
}
function pupalDurations(speciesId, basis){
  const out=[];
  for(const ind of all("individuals")){
    if(speciesOfInd(ind)?.id!==speciesId) continue;
    const st = basis==="verpuppt" ? realPupation(ind) : firstEv(ind,"eingegraben");
    const ec = firstEv(ind,"falterschlupf");
    if(st && ec) out.push({ind, d:daysBetween(st,ec), sex:ind.sex||"u"});
  }
  return out;
}
function forecast(ind){
  if(firstEv(ind,"falterschlupf") || !isAlive(ind)) return null;
  const st = pupalStart(ind); if(!st) return null;
  const sp = speciesOfInd(ind); if(!sp) return null;
  const ds = pupalDurations(sp.id, st.basis);
  const same = ds.filter(x=>ind.sex && ind.sex!=="u" && x.sex===ind.sex);
  const use = same.length>=2 ? same : ds;
  const startMs = evMid(st.ev);
  if(use.length<2) return {insufficient:true, n:use.length, basis:st.basis, startMs};
  const v = use.map(x=>x.d);
  const mn=Math.min(...v), mx=Math.max(...v), md=median(v);
  const from=startMs+mn*864e5, to=startMs+mx*864e5, med=startMs+md*864e5;
  const now=Date.now(); const elapsed=Math.floor((now-startMs)/864e5);
  const state = now<from ? "vor" : now<=to+864e5 ? "im" : "ueber";
  return {from,to,med,mn,mx,md,n:use.length,bySex:use===same,basis:st.basis,startMs,elapsed,state};
}

/* ============ Speicher (IndexedDB) ============ */
/* Eine Datenbank „raupenbuch“: ein Object Store je Collection (Schlüssel = id),
   dazu „blobs“ (Fotos als Blob, Schlüssel = blobId) und „meta“ (Einstellungen, letztes Backup …). */
const IDB_NAME = "raupenbuch", IDB_VER = 1;
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(IDB_NAME, IDB_VER);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      for(const c of COLS) if(!db.objectStoreNames.contains(c)) db.createObjectStore(c, {keyPath:"id"});
      if(!db.objectStoreNames.contains("blobs")) db.createObjectStore("blobs");
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
    rq.onblocked = () => toast("Bitte andere Raupenbuch-Tabs schließen");
  });
}
const idbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
const idbDone = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("abgebrochen")); });

const store = {
  mode: "loading", db: null, loaded: new Set(), urls: new Map(), meta: {}, persisted: null, estimate: null,
  async init(){
    try {
      this.db = await idbOpen();
      const tx = this.db.transaction([...COLS, "meta", "blobs"], "readonly");
      const jobs = COLS.map(c => idbReq(tx.objectStore(c).getAll()).then(rows => { const m = {}; rows.forEach(r => m[r.id] = r); S[c] = m; }));
      jobs.push(Promise.all([idbReq(tx.objectStore("meta").getAllKeys()), idbReq(tx.objectStore("meta").getAll())]).then(([k, v]) => { k.forEach((key, i) => this.meta[key] = v[i]); }));
      jobs.push(Promise.all([idbReq(tx.objectStore("blobs").getAllKeys()), idbReq(tx.objectStore("blobs").getAll())]).then(([k, v]) => { k.forEach((key, i) => this.urls.set(key, URL.createObjectURL(v[i]))); }));
      await Promise.all(jobs);
      this.mode = "idb";
      if(!Object.keys(S.species).length){ seedSpeciesLocal(); for(const sp of Object.values(S.species)) await this.raw("species", sp); }
    } catch(e){
      console.error(e); this.mode = "mem";
      toast("Speicher nicht verfügbar: Daten gehen beim Schließen verloren");
      if(!Object.keys(S.species).length) seedSpeciesLocal();
    }
    _evIdx = null;
    COLS.forEach(c => this.loaded.add(c));
    scheduleRender();
    this.checkPersist(true);
  },
  async checkPersist(ask){
    try {
      if(navigator.storage?.persisted) this.persisted = await navigator.storage.persisted();
      if(ask && this.persisted === false && navigator.storage?.persist) this.persisted = await navigator.storage.persist();
      if(navigator.storage?.estimate) this.estimate = await navigator.storage.estimate();
    } catch(e){}
    scheduleRender();
  },
  ready(){ return COLS.every(c => this.loaded.has(c)); },
  async raw(col, doc){
    if(this.mode !== "idb") return;
    const tx = this.db.transaction(col, "readwrite"); tx.objectStore(col).put(doc); await idbDone(tx);
  },
  async put(col, obj){
    const id = obj.id || uid();
    const body = {...obj, id};
    body.updatedAt = new Date().toISOString();
    if(!body.createdAt) body.createdAt = body.updatedAt;
    for(const k of Object.keys(body)) if(body[k] === undefined) delete body[k];
    S[col][id] = body; if(col==="events") _evIdx = null;
    scheduleRender();
    try { await this.raw(col, body); }
    catch(e){ toast(e && e.name === "QuotaExceededError" ? "Speicher voll: bitte Fotos löschen oder Backup machen" : "Konnte nicht speichern ("+(e&&e.name||"Fehler")+")"); }
    return id;
  },
  /* Import: Dokument unverändert übernehmen (Zeitstempel bleiben) */
  async putRaw(col, doc){
    if(!doc || !doc.id) return;
    S[col][doc.id] = doc; if(col==="events") _evIdx = null;
    await this.raw(col, doc);
  },
  async del(col, id){
    delete S[col][id]; if(col==="events") _evIdx = null;
    scheduleRender();
    if(this.mode !== "idb") return;
    try { const tx = this.db.transaction(col, "readwrite"); tx.objectStore(col).delete(id); await idbDone(tx); }
    catch(e){ toast("Löschen fehlgeschlagen"); }
  },
  async putBlob(blobId, blob){
    if(this.mode === "idb"){ const tx = this.db.transaction("blobs", "readwrite"); tx.objectStore("blobs").put(blob, blobId); await idbDone(tx); }
    const old = this.urls.get(blobId); if(old) URL.revokeObjectURL(old);
    this.urls.set(blobId, URL.createObjectURL(blob));
  },
  async getBlob(blobId){
    if(this.mode === "idb"){ const tx = this.db.transaction("blobs", "readonly"); const b = await idbReq(tx.objectStore("blobs").get(blobId)); if(b) return b; }
    const u = this.urls.get(blobId); if(u) return await (await fetch(u)).blob();
    return null;
  },
  async uploadPhoto(blob){
    const blobId = "b" + uid();
    await this.putBlob(blobId, blob);
    return {blobId};
  },
  async deletePhotoAsset(p){
    if(!p.blobId) return;
    const u = this.urls.get(p.blobId); if(u){ URL.revokeObjectURL(u); this.urls.delete(p.blobId); }
    if(this.mode === "idb"){ try { const tx = this.db.transaction("blobs", "readwrite"); tx.objectStore("blobs").delete(p.blobId); await idbDone(tx); } catch(e){} }
  },
  async setMeta(k, v){
    this.meta[k] = v;
    if(this.mode === "idb"){ try { const tx = this.db.transaction("meta", "readwrite"); tx.objectStore("meta").put(v, k); await idbDone(tx); } catch(e){} }
  },
  /* Datei speichern: normaler Browser-Download */
  async save(filename, data){
    try {
      const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".json") ? "application/json" : filename.endsWith(".csv") ? "text/csv" : "application/octet-stream"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast("Download gestartet");
      return true;
    } catch(e){ toast("Download fehlgeschlagen"); return false; }
  }
};

/* ============ Fotos verkleinern ============ */
async function shrinkImage(file, max=1600, q=.85){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const sc = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*sc); c.height = Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", q));
  } finally { URL.revokeObjectURL(url); }
}

const svg = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

const R = { stack: [{v:"home"}], q: "", animalFilter: "aktiv", imagoTab: "offen" };
const cur = () => R.stack[R.stack.length-1];
function nav(v, p={}){ R.stack.push({v, ...p}); window.scrollTo(0,0); render(); }
function tab(v){ R.stack = [{v}]; window.scrollTo(0,0); render(); }
function back(){ if(R.stack.length>1) R.stack.pop(); render(); }

let _rq = false;
function scheduleRender(){ if(_rq) return; _rq = true; requestAnimationFrame(()=>{ _rq=false; render(); }); }

const TABS = [["home","Übersicht","home"],["animals","Tiere","bug"],["imagos","Zuordnen","moth"],["climate","Klima","temp"],["more","Mehr","more"]];
const TAB_OF = {home:"home",animals:"animals",animal:"animals",brood:"animals",broods:"animals",imagos:"imagos",imago:"imagos",compare:"imagos",
  climate:"climate",location:"climate",more:"more",species:"more",sources:"more",containers:"more",labels:"more",data:"more",stats:"home",search:"",scanresult:""};

function render(){
  const ae = document.activeElement; const focusId = ae && ae.id && $("#main").contains(ae) ? ae.id : null;
  const selS = focusId && ae.selectionStart;
  const r = cur();
  const top = $("#top");
  const isRoot = R.stack.length===1;
  const unresolved = openImagos().length;
  top.innerHTML = (isRoot
      ? `<div class="brand">Raupenbuch${store.mode==="mem"?'<small>ohne Speicher</small>':''}</div>`
      : `<button class="backbtn" data-act="back">${svg("back")}Zurück</button><div class="brand"></div>`)
    + `<button class="iconbtn" data-act="search" aria-label="Suchen">${svg("search")}</button>`
    + `<button class="iconbtn" data-act="scan" aria-label="QR-Etikett scannen">${svg("scan")}</button>`;
  const active = TAB_OF[r.v] ?? "";
  $("#tabs").innerHTML = TABS.map(([v,l,i]) => `<button data-tab="${v}" ${active===v?'aria-current="page"':''}>${svg(i)}<span>${l}${v==="imagos"&&unresolved?` (${unresolved})`:''}</span></button>`).join("");
  if(!store.ready()){ $("#main").innerHTML = `<p class="muted">Lade dein Raupenbuch …</p>`; return; }
  if(!_migrated) setTimeout(()=>migrateImagos().catch(()=>{}),0);
  const fn = VIEWS[r.v] || VIEWS.home;
  let html; try { html = fn(r); } catch(e){ console.error(e); html = `<div class="note warn">Diese Ansicht konnte nicht angezeigt werden: ${esc(e.message)}</div>`; }
  $("#main").innerHTML = html;
  if(focusId){ const el = document.getElementById(focusId); if(el){ el.focus(); try{ el.setSelectionRange(selS,selS); }catch(e){} } }
}

/* Delegation */
const ACTS = {};
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-tab],[data-go]");
  if(!t) return;
  if(t.dataset.tab){ tab(t.dataset.tab); return; }
  if(t.dataset.go){ const [v,id] = t.dataset.go.split(":"); nav(v, id?{id}:{}); return; }
  const a = t.dataset.act; if(ACTS[a]){ ev.preventDefault(); ACTS[a](t.dataset, t, ev); }
});
ACTS.back = () => back();
ACTS.search = () => nav("search");

/* Toast */
let _tt;
function toast(msg){
  let el = $(".toast"); if(!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(_tt); _tt = setTimeout(()=>el.remove(), 2600);
}

/* Bottom sheet */
function openSheet(html, onMount){
  closeSheet();
  const sc = document.createElement("div"); sc.className = "scrim"; sc.id = "scrim";
  sc.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  sc.addEventListener("click", e => { if(e.target === sc) closeSheet(); });
  document.body.appendChild(sc);
  document.body.style.overflow = "hidden";
  onMount && onMount(sc.firstElementChild);
  return sc.firstElementChild;
}
let _sheetCleanup = null;
function closeSheet(){ if(_sheetCleanup){ const f = _sheetCleanup; _sheetCleanup = null; try { f(); } catch(e){} } const s = $("#scrim"); if(s) s.remove(); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });

/* Formular-Bausteine */
const fld = {

  sel:(id,l,opts,v="") => `<div class="f"><label for="${id}">${l}</label><select id="${id}">${opts.map(([k,t])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`,

/* Zeit-Eingabe (Präzision) */
function timeFields(pfx, e){
  const prec = e?.prec || "tag";
  const d0 = e?.t0 ? e.t0.slice(0,10) : todayISO();
  const tm = e?.t0 && e.prec==="exakt" ? e.t0.slice(11,16) : (nowLocal().slice(11,16));
  const d1 = e?.t1 ? e.t1.slice(0,10) : d0;
  return `<div class="f"><span class="lab">Wann?</span><div class="seg" role="group" id="${pfx}precseg">${Object.entries(PREC).map(([k,l])=>`<button type="button" data-prec="${k}" aria-pressed="${k===prec}">${l}</button>`).join("")}</div></div>
  <input type="hidden" id="${pfx}prec" value="${prec}">
  <div class="frow2"><div class="f"><label for="${pfx}d0" id="${pfx}d0l">${prec==="nacht"?"Abend":prec==="zeitraum"?"Von":"Datum"}</label><input id="${pfx}d0" type="date" value="${d0}"></div>
  <div class="f" id="${pfx}tmw" ${prec==="exakt"?"":"hidden"}><label for="${pfx}tm">Uhrzeit</label><input id="${pfx}tm" type="time" value="${tm}"></div>
  <div class="f" id="${pfx}d1w" ${prec==="zeitraum"?"":"hidden"}><label for="${pfx}d1">Bis</label><input id="${pfx}d1" type="date" value="${d1}"></div></div>
  <div class="hint" id="${pfx}hint">${prec==="nacht"?"Für Schlüpfe über Nacht: das Datum des Abends wählen.":""}</div>`;
}
function wireTime(root, pfx){
  root.querySelectorAll(`#${pfx}precseg [data-prec]`).forEach(b => b.addEventListener("click", () => {
    const p = b.dataset.prec; root.querySelector(`#${pfx}prec`).value = p;
    root.querySelectorAll(`#${pfx}precseg [data-prec]`).forEach(x => x.setAttribute("aria-pressed", x===b));
    root.querySelector(`#${pfx}tmw`).hidden = p!=="exakt";
    root.querySelector(`#${pfx}d1w`).hidden = p!=="zeitraum";
    root.querySelector(`#${pfx}d0l`).textContent = p==="nacht"?"Abend":p==="zeitraum"?"Von":"Datum";
    root.querySelector(`#${pfx}hint`).textContent = p==="nacht"?"Für Schlüpfe über Nacht: das Datum des Abends wählen.":"";
  }));
}
function readTime(root, pfx){
  const d0 = val(root,pfx+"d0"); if(!d0) return null;
  return makeTime(val(root,pfx+"prec"), d0, val(root,pfx+"tm"), val(root,pfx+"d1"));
}

/* Inline-Bestätigung (confirm() ist im Viewer blockiert) */
function confirmBlock(text, okLabel){
  return `<div class="confirm" hidden id="cfm"><div>${text}</div><div class="btns"><button class="btn danger" id="cfmOk">${okLabel}</button><button class="btn" id="cfmNo">Abbrechen</button></div></div>`;
}
function wireConfirm(root, triggerSel, onOk){
  const t = root.querySelector(triggerSel), box = root.querySelector("#cfm");
  if(!t||!box) return;
  t.addEventListener("click", () => { box.hidden = false; box.scrollIntoView({block:"nearest"}); });
  root.querySelector("#cfmNo").addEventListener("click", () => box.hidden = true);
  root.querySelector("#cfmOk").addEventListener("click", onOk);
}

function avatar(ind){
  const st = statusOf(ind); const g = st==="tot" ? "dead" : STG(currentStage(ind));
  const ph = photosOf("individual", ind.id).slice(-1)[0];
  return `<span class="av st-${g}">${ph?`<img src="${esc(photoSrc(ph))}" alt="">`:ic2(g)}<b class="${ind.sex||"u"}">${SEXS[ind.sex||"u"]}</b></span>`;
}
const sexBadge = s => `<span class="sex ${s||"u"}" title="${SEXL[s||"u"]}">${SEXS[s||"u"]}</span>`;
function stagePill(ind){
  const st = statusOf(ind);
  if(st==="tot") return `<span class="pill st st-dead"><i></i>tot</span>`;
  if(st==="praepariert") return `<span class="pill st st-imago"><i></i>präpariert</span>`;
  if(st==="abgegeben") return `<span class="pill st st-neutral"><i></i>abgegeben</span>`;
  if(st==="freigelassen") return `<span class="pill st st-imago"><i></i>freigelassen</span>`;
  const s = currentStage(ind);
  return `<span class="pill st st-${STG(s)}"><i></i>${s==="?"?"Stadium ?":stageLabel(s)}</span>`;

const tagsOf = i => Array.isArray(i?.tags) ? i.tags : [];
function allTags(){ const c = new Map(); for(const i of all("individuals")) for(const t of tagsOf(i)) c.set(t, (c.get(t)||0)+1); return [...c.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"de")).map(x=>x[0]); }
function parseTags(str){ const out = []; for(const t of String(str||"").split(/[,;\n]+/).map(x=>x.trim().replace(/^#/,"")).filter(Boolean)) if(!out.some(o=>o.toLowerCase()===t.toLowerCase())) out.push(t); return out; }
const tagMini = i => tagsOf(i).map(t=>`<span class="tagmini">#${esc(t)}</span>`).join("");
function indRow(ind, extra=""){
  const sp = speciesOfInd(ind); const b = S.broods[ind.broodId];
  return `<button class="row" data-go="animal:${ind.id}">${avatar(ind)}<span class="main"><span class="t">${esc(ind.name)}${tagMini(ind)}</span><span class="s">${extra || `<span class="sp">${esc(sp?.sci||"")}</span> · ${esc(b?.name||"")}`}</span></span><span class="end">${stagePill(ind)}</span></button>`;

/* ============ Ansichten ============ */
const VIEWS = {};

function forecastRow(ind, f){
  const span = Math.max(f.to - f.startMs, 1);
  const L = x => Math.max(0, Math.min(100, (x - f.startMs) / (span*1.15) * 100));
  const pill = f.state==="im" ? `<span class="pill warn">im Fenster</span>` : f.state==="ueber" ? `<span class="pill crit">länger als bisher</span>` : `<span class="pill">Tag ${f.elapsed}</span>`;
  return `<button class="row" data-go="animal:${ind.id}" style="display:block">
    <div class="fc"><span class="t" style="display:flex;gap:8px;align-items:center">${sexBadge(ind.sex)} <b>${esc(ind.name)}</b></span>${pill}
    <span class="win muted">${dShort(dFromMs(f.from))}–${dDE(dFromMs(f.to))} · Median ${dShort(dFromMs(f.med))}</span><span class="small muted mono">n=${f.n}${f.bySex?" "+SEXS[ind.sex]:""}</span>
    <div class="track" aria-hidden="true"><div class="w" style="left:${L(f.from)}%;width:${Math.max(1.5,L(f.to)-L(f.from))}%"></div><div class="today" style="left:${L(Date.now())}%"></div></div></div></button>`;
}

VIEWS.home = () => {
  const inds = all("individuals"); const alive = inds.filter(isAlive);
  const pupae = alive.filter(i => ["vorpuppe","puppe"].includes(currentStage(i)));
  const unresolved = openImagos();
  const broods = all("broods").filter(b=>!b.archived).sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""));
  const fcs = pupae.map(i=>[i,forecast(i)]).filter(([,f])=>f && !f.insufficient).sort((a,b)=>a[1].from-b[1].from);
  const noData = pupae.filter(i=>{ const f=forecast(i); return f && f.insufficient; });
  const recent = all("events").sort((a,b)=>(b.t0||"").localeCompare(a.t0||"")).slice(0,6);
  let h = "";
  if(store.mode==="mem") h += `<div class="note warn">Der Gerätespeicher ist nicht verfügbar (privates Fenster?). Einträge gehen beim Schließen verloren.</div>`;
  if(!broods.length){
    h += `<section class="card sec"><h2 class="sp" style="font-size:22px">Willkommen im Raupenbuch</h2>
    <p class="muted" style="margin:0">Leg zuerst einen <b>Zuchtansatz</b> an, also alles, was zusammen angefangen hat (z. B. „Atropos 2026 von Jana“). Danach kannst du deine Tiere mit Namen hinzufügen oder aus deinen Notizen einfügen.</p>
    <div class="btns"><button class="btn primary" data-act="newBrood">Zuchtansatz anlegen</button></div></section>`;
    return h;
  }
  const larvae = alive.filter(i=>STG(currentStage(i))==="larva").length;
  h += `<section class="hero"><div><div class="kick">${dDE(todayISO())} · ${broods.length} Zuchtansatz${broods.length===1?"":"e"}</div><h1>Guten Tag!</h1></div>
    <div class="kpis">
      <div class="kpi st-larva">${ic2("larva")}<b>${larvae}</b><span>Raupen</span></div>
      <div class="kpi st-pupa">${ic2("pupa")}<b>${pupae.length}</b><span>Puppen &amp; Vorpuppen</span></div>
      <div class="kpi st-imago">${ic2("imago")}<b>${inds.filter(i=>firstEv(i,"falterschlupf")).length}</b><span>Falter</span></div>
      <div class="kpi st-dead">${ic2("dead")}<b>${inds.filter(i=>statusOf(i)==="tot" && !firstEv(i,"falterschlupf")).length}</b><span>Verluste</span></div>
    </div>
    <button class="btn primary cta" data-act="eclosion">${ic2("imago","ic")}Falterschlupf erfassen</button>
    <button class="btn block" data-act="multiEvent">Ereignis für mehrere</button></section>`;
  h += backupCard();
  if(unresolved.length) h += `<section class="uncertain"><b>${unresolved.length} Falter noch nicht zugeordnet</b><span class="small muted">Wenn mehrere in einer Nacht schlüpfen, ist offen, wer wer ist. Ordne sie zu, sobald du es weißt.</span><div><button class="btn" data-tab="imagos">Zuordnen</button></div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Schlupffenster</h2><span class="small muted">aus deinen bisherigen Puppenruhen</span></div>`;
  if(fcs.length) h += `<div class="list">${fcs.map(([i,f])=>forecastRow(i,f)).join("")}</div>`;
  else if(pupae.length) h += `<div class="list"><div class="empty">${pupae.length} Puppe${pupae.length>1?"n":""} liegen, aber es gibt noch zu wenige geschlüpfte Tiere derselben Art für eine Prognose. Ab <b>2 Schlüpfen</b> mit bekanntem Eingrabe- oder Verpuppungsdatum erscheint hier ein Zeitfenster.</div></div>`;
  else h += `<div class="list"><div class="empty">Gerade liegen keine Puppen.</div></div>`;
  if(fcs.length && noData.length) h += `<p class="small muted" style="margin:0">${noData.length} weitere Puppe(n) ohne genug Vergleichsdaten.</p>`;
  h += `</section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Zuchtansätze</h2><button class="btn ghost link" data-act="newBrood">+ Neu</button></div><div class="list">${broods.map(broodRow).join("")}</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Zuletzt eingetragen</h2><button class="btn ghost link" data-go="stats">Auswertung</button></div><div class="list">${recent.length? recent.map(e=>{
      const who = e.individualId? indName(e.individualId) : e.containerId? (S.containers[e.containerId]?.name||"Behälter") : (S.broods[e.broodId]?.name||"");
      return `<button class="row" ${e.individualId?`data-go="animal:${e.individualId}"`:`data-act="editEvent" data-id="${e.id}"`}><span class="main"><span class="t">${esc(evTitle(e))}</span><span class="s">${esc(who)} · ${esc(fmtTime(e))}</span></span></button>`;
    }).join("") : `<div class="empty">Noch keine Ereignisse.</div>`}</div></section>`;
  return h;
};

function broodRow(b){
  const inds = indsOf(b.id); const sp = S.species[b.speciesId];
  const dist = {}; inds.forEach(i => { const k = isAlive(i) ? currentStage(i) : "x"; dist[k]=(dist[k]||0)+1; });
  const parts = Object.entries(dist).sort((a,b)=>(SIDX[a[0]]??99)-(SIDX[b[0]]??99)).map(([k,n])=>`${n}× ${k==="x"?"tot/weg":stageLabel(k)}`).join(" · ");
  return `<button class="row" data-go="brood:${b.id}"><span class="main"><span class="t">${esc(b.name)}</span><span class="s"><span class="sp">${esc(sp?.sci||"")}</span> · ${inds.length} Tiere${parts?" · "+parts:""}</span></span></button>`;
}

function evTitle(e){
  const d = e.data||{};
  switch(e.type){
    case "haeutung": return `Häutung → ${d.to||"?"}`;
    case "verpuppt": return d.est ? "Verpuppt (geschätzt)" : "Verpuppt";
    case "stadium": return `Stadium: ${stageLabel(d.to)}`;
    case "geschlecht": return `Geschlecht: ${SEXL[d.sex||"u"]}${d.at?` (an ${d.at==="puppe"?"Puppe":d.at==="falter"?"Falter":"Raupe"})`:""}`;
    case "gewicht": return `Gewogen: ${fmtN(+d.g,2)} g`;
    case "futter": return `Futter: ${d.plant||"–"}`;
    case "umgesetzt": return `Umgesetzt → ${S.containers[d.containerId]?.name||"?"}`;
    case "tod": return `Gestorben: ${CAUSES[d.cause]||"Unbekannt"}${d.certainty==="vermutet"?" (Verdacht)":""}`;
    case "abgegeben": return `Abgegeben${d.to?` an ${d.to}`:""}`;
    default: return ET[e.type]?.l || e.type;
  }
}

/* ---- Tiere ---- */
VIEWS.animals = () => {
  const q = R.q.toLowerCase();
  const f = R.animalFilter;
  let inds = all("individuals").sort(byName);
  if(f==="aktiv") inds = inds.filter(isAlive);
  else if(f==="puppe") inds = inds.filter(i=>isAlive(i)&&["vorpuppe","puppe"].includes(currentStage(i)));
  else if(f==="falter") inds = inds.filter(i=>firstEv(i,"falterschlupf"));
  else if(f==="tot") inds = inds.filter(i=>statusOf(i)==="tot");
  if(R.tagF) inds = inds.filter(i => tagsOf(i).includes(R.tagF));
  if(q) inds = inds.filter(i => (i.name+" "+(i.notes||"")+" "+(S.broods[i.broodId]?.name||"")+" "+tagsOf(i).map(t=>"#"+t).join(" ")).toLowerCase().includes(q));
  const TG = allTags();
  const broods = all("broods").sort((a,b)=>(b.startDate||"").localeCompare(a.startDate||""));
  const F = [["aktiv","Aktiv"],["puppe","Puppen"],["falter","Falter"],["tot","Tot"],["alle","Alle"]];
  return `<div class="search">${svg("search").replace('<svg','<svg width="18" height="18" style="stroke:currentColor;fill:none;stroke-width:1.8"')}<input id="aq" placeholder="Tier suchen (Name, Notiz, Ansatz)" value="${esc(R.q)}"></div>
  <div class="seg" role="group" aria-label="Filter">${F.map(([k,l])=>`<button data-act="afilter" data-k="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
  ${TG.length?`<div class="chips">${TG.map(t=>`<button class="chip ${R.tagF===t?"on":""}" data-act="tagFilter" data-k="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:""}
  <section class="sec"><div class="sec-h"><h2>${inds.length} Tier${inds.length===1?"":"e"}</h2></div>
  <div class="list">${inds.length? inds.map(i=>indRow(i)).join("") : `<div class="empty">${all("individuals").length? "Keine Tiere für diesen Filter." : "Noch keine Tiere. Öffne einen Zuchtansatz und füge dort Tiere hinzu."}</div>`}</div></section>
  <section class="sec"><div class="sec-h"><h2>Zuchtansätze</h2><button class="btn ghost link" data-act="newBrood">+ Neu</button></div>
  <div class="list">${broods.length? broods.map(broodRow).join("") : `<div class="empty">Noch kein Zuchtansatz.</div>`}</div></section>`;
};
document.addEventListener("input", e => { if(e.target.id==="aq"){ R.q = e.target.value; scheduleRender(); } });
ACTS.afilter = d => { R.animalFilter = d.k; render(); };
ACTS.tagFilter = d => { R.tagF = R.tagF===d.k ? null : d.k; render(); };
ACTS.noop = () => {};
ACTS.lang = d => setLang(d.k);

/* ---- Zuchtansatz ---- */
VIEWS.brood = r => {
  const b = S.broods[r.id]; if(!b) return `<div class="empty">Dieser Zuchtansatz existiert nicht mehr.</div>`;
  const sp = S.species[b.speciesId]; const src = S.sources[b.sourceId];
  const inds = indsOf(b.id);
  const alive = inds.filter(isAlive);
  const eclosed = inds.filter(i=>firstEv(i,"falterschlupf"));
  const dead = inds.filter(i=>statusOf(i)==="tot" && !firstEv(i,"falterschlupf"));
  let h = `<div class="pagehead"><span class="sp muted">${esc(sp?.sci||"")}${spCommon(sp)?` · ${esc(spCommon(sp))}`:""}</span><h1>${esc(b.name)}</h1>
    <div class="meta">${src?`<span class="pill">von ${esc(src.name)}</span>`:""}${b.generation?`<span class="pill">F${esc(b.generation)}</span>`:""}${b.startDate?`<span class="pill">seit ${dDE(b.startDate)}</span>`:""}<span class="pill stage">Start als ${stageLabel(b.startStage||"L1")}</span></div>
    ${b.notes?`<p class="muted" style="margin:0">${esc(b.notes)}</p>`:""}</div>`;
  h += `<div class="stats"><div class="stat"><b>${inds.length}</b><span>Tiere</span></div><div class="stat"><b>${alive.length}</b><span>aktiv</span></div><div class="stat"><b>${eclosed.length}</b><span>Falter</span></div><div class="stat"><b>${dead.length}</b><span>Verluste</span></div></div>`;
  h += `<div class="btns"><button class="btn primary" data-act="addInds" data-id="${b.id}">Tiere hinzufügen</button><button class="btn" data-act="multiEvent" data-brood="${b.id}">Ereignis für mehrere</button><button class="btn" data-act="eclosion" data-brood="${b.id}">Falterschlupf</button></div>`;
  if(inds.length) h += funnelSection(inds, b);
  const pd = pupalTable(inds); if(pd) h += pd;
  h += `<section class="sec"><div class="sec-h"><h2>Tiere</h2><button class="btn ghost link" data-act="labels" data-brood="${b.id}">Etiketten</button></div><div class="list">${inds.length? inds.map(i=>indRow(i, indSubline(i))).join("") : `<div class="empty">Noch keine Tiere. Tippe auf <b>Tiere hinzufügen</b>. Du kannst dort auch deine Notizen zeilenweise einfügen.</div>`}</div></section>`;
  const bev = (evIndex().brood[b.id]||[]);
  if(bev.length) h += `<section class="sec"><div class="sec-h"><h2>Ereignisse am Ansatz</h2></div><div class="card">${timeline(bev)}</div></section>`;
  h += `<div class="btns"><button class="btn" data-act="editBrood" data-id="${b.id}">Ansatz bearbeiten</button></div>`;
  return h;
};
function indSubline(i){
  const parts = [];
  const eg = firstEv(i,"eingegraben"), ec = firstEv(i,"falterschlupf"), d = deathOf(i);
  if(eg) parts.push(`eingegr. ${dShort(eg.t0)}`);
  if(ec) parts.push(`geschl. ${dShort((ec.t1||ec.t0))}`);
  if(d && !ec) parts.push(`† ${dShort(d.t0)}`);
  const f = forecast(i); if(f && !f.insufficient) parts.push(`erwartet ${dShort(dFromMs(f.from))}–${dShort(dFromMs(f.to))}`);
  return parts.join(" · ") || "noch keine Einträge";
}

function funnelSection(inds, b){
  const start = SIDX[b?.startStage||"L1"] ?? 1;
  const rows = [];
  for(let s=start; s<STAGES.length; s++){
    const reached = inds.filter(i=>maxStageIdx(i)>=s).length;
    const lost = inds.filter(i=>maxStageIdx(i)<s && !isAlive(i)).length;
    const pend = inds.filter(i=>maxStageIdx(i)<s && isAlive(i)).length;
    rows.push({l:STAGES[s].l, reached, lost, pend});
  }
  const n = inds.length || 1;
  return `<section class="sec"><div class="sec-h"><h2>Überleben je Stadium</h2></div><div class="card funnel">
    ${rows.map(r=>`<div class="frow"><span class="lbl">${r.l}</span><div class="fbar" role="img" aria-label="${r.l}: ${r.reached} erreicht, ${r.pend} ausstehend, ${r.lost} verloren"><i class="r" style="width:${r.reached/n*100}%"></i><i class="p" style="width:${r.pend/n*100}%"></i><i class="l" style="width:${r.lost/n*100}%"></i></div><span class="v">${r.reached}/${inds.length}</span></div>`).join("")}
    <div class="legend"><span><i style="background:var(--good)"></i>erreicht</span><span><i style="background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);border:1px solid var(--line)"></i>noch unterwegs</span><span><i style="background:var(--crit)"></i>verloren</span></div></div></section>`;
}

function pupalTable(inds){
  const rows = {f:[],m:[],u:[]}; let basisMix = new Set();
  for(const i of inds){ const st = pupalStart(i), ec = firstEv(i,"falterschlupf"); if(st && ec){ rows[i.sex||"u"].push(daysBetween(st.ev,ec)); basisMix.add(st.basis); } }
  const tot = [...rows.f,...rows.m,...rows.u]; if(!tot.length) return "";
  const line = (l,a) => a.length? `<tr><td>${l}</td><td>${a.length}</td><td>${Math.min(...a)}</td><td>${fmtN(median(a),1)}</td><td>${Math.max(...a)}</td></tr>` : "";
  const basis = basisMix.size>1 ? "gemischt (Verpuppung bzw. Eingraben)" : basisMix.has("verpuppt") ? "ab Verpuppung" : "ab Eingraben";
  return `<section class="sec"><div class="sec-h"><h2>Puppenruhe in Tagen</h2><span class="small muted">${basis}</span></div><div class="card tw"><table class="t"><thead><tr><th></th><th>n</th><th>min</th><th>Median</th><th>max</th></tr></thead><tbody>
  ${line("Weibchen",rows.f)}${line("Männchen",rows.m)}${line("unbekannt",rows.u)}${(rows.f.length&&rows.m.length)||rows.u.length?line("alle",tot):""}</tbody></table>
  ${tot.length<5?`<p class="small muted" style="margin:8px 0 0">Wenige Werte: Unterschiede können Zufall sein.</p>`:""}</div></section>`;
}

/* ---- Auswertung pro Tier ---- */
const END_TYPES = ["tod","praepariert","freigelassen","abgegeben"];
const dayNo = t => { const d = new Date(t); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5); };
function stageSegments(ind){
  const b = S.broods[ind.broodId]; const now = Date.now(); const pts = [];
  const st0 = startStageOf(ind);
  if(b?.startDate && st0!=="?") pts.push({k:st0, t:ms(b.startDate), est:false, src:"Start des Zuchtansatzes"});
  for(const e of evOf(ind.id)){
    const fn = ET[e.type]?.stage; const k = fn && fn(e.data||{}); if(!k) continue;
    if(!evIsDue(e)) continue;
    const t = Math.min(evMid(e), now);
    pts.push({k, t, exact:e.prec==="exakt", est:!!e.data?.est || e.type==="stadium" || e.prec==="zeitraum"});
  }
  pts.sort((a,b)=>a.t-b.t);
  const P = []; for(const p of pts){ if(P.length && P[P.length-1].k===p.k) continue; P.push(p); }
  const endEv = evOf(ind.id).find(e=>END_TYPES.includes(e.type));
  const endT = endEv ? evMid(endEv) : null;
  return P.map((p,i)=>{ const nx = P[i+1]; const to = nx ? nx.t : (endT ?? now); const open = !nx && !endT;
    /* Laufende Stadien und die Falterzeit zählen Kalendertage inklusive Start- und heutigem bzw. letztem Tag,
       sofern keine genaue Uhrzeit angegeben ist. Abgeschlossene Stadien: Differenz der Daten. */
    const inclusive = (open || p.k==="falter") && !p.exact;
    const days = inclusive ? dayNo(to) - dayNo(p.t) + 1 : Math.max(0,(to-p.t)/864e5);
    return {k:p.k, from:p.t, to, days, open, inclusive, exact:p.exact, est:p.est || !!nx?.est}; });
}
function speciesStageDays(spId, k, exceptId){
  const v = [];
  for(const ind of all("individuals")){ if(ind.id===exceptId || speciesOfInd(ind)?.id!==spId) continue;
    for(const sg of stageSegments(ind)) if(sg.k===k && !sg.open && !sg.est) v.push(sg.days); }
  return v;
}
function animalStats(i){
  const sp = speciesOfInd(i); const segs = stageSegments(i);
  const rows = segs.map(sg=>{ const cmp = sp ? speciesStageDays(sp.id, sg.k, i.id) : [];
    const dd = sg.inclusive ? fmtN(sg.days,0) : sg.exact && sg.open ? fmtN(sg.days,1) : sg.days<1 ? "<1" : fmtN(Math.floor(sg.days),0);
    return `<tr><td>${esc(stageLabel(sg.k))}</td><td>${dShort(dFromMs(sg.from))}</td><td>${sg.est?"≈":""}${dd}${sg.open?"+":""}</td><td>${cmp.length>=2?`${fmtN(median(cmp),1)} <span class="muted">n=${cmp.length}</span>`:`<span class="muted">–</span>`}</td></tr>`; }).join("");
  const tiles = [];
  const ec = firstEv(i,"falterschlupf"), ps = pupalStart(i);
  if(ps && ec){
    const d = daysBetween(ps.ev, ec);
    const others = sp ? pupalDurations(sp.id, ps.basis).filter(x=>x.ind.id!==i.id).map(x=>x.d) : [];
    tiles.push([`${d}`, `Tage Puppenruhe ${ps.basis==="verpuppt"?"ab Verpuppung":"ab Eingraben"}`, others.length>=2?`Art: Median ${fmtN(median(others),1)} (n=${others.length}), ${d<median(others)?"kürzer":d>median(others)?"länger":"gleich"}`:""]);
  } else if(ps && isAlive(i)){
    tiles.push([`${Math.floor((Date.now()-evMid(ps.ev))/864e5)}`, `Tage seit ${ps.basis==="verpuppt"?"Verpuppung":"Eingraben"}`, ""]);
  }
  if(segs.length && ec){
    const first = segs[0]; const tot = Math.round((evMid(ec)-first.from)/864e5);
    tiles.push([`${tot}`, `Tage von ${stageLabel(first.k)} bis Falter`, ""]);
  }
  const endEv = evOf(i.id).find(e=>END_TYPES.includes(e.type));
  const fs = segs.find(sg=>sg.k==="falter");
  if(fs && (fs.open || (endEv && ["tod","praepariert"].includes(endEv.type)))) tiles.push([`${fs.inclusive?fmtN(fs.days,0):fmtN(fs.days,1)}`, fs.open?"Tage als Falter (heute mitgezählt)":"Tage als Falter", ""]);
  const W = evOf(i.id).filter(e=>e.type==="gewicht" && Number.isFinite(+e.data?.g)).map(e=>({at:e.t0, g:+e.data.g}));
  if(W.length) tiles.push([`${fmtN(Math.max(...W.map(w=>w.g)),2)}`, "g höchstes Gewicht", W.length>1?`${W.length} Wägungen`:""]);
  if(!rows && !tiles.length) return "";
  let h = `<section class="sec"><div class="sec-h"><h2>Auswertung</h2><span class="small muted">≈ geschätzt · + läuft noch</span></div>`;
  if(tiles.length) h += `<div class="stats">${tiles.map(([v,l,x])=>`<div class="stat"><b>${v}</b><span>${l}</span>${x?`<span class="small">${esc(x)}</span>`:""}</div>`).join("")}</div>`;
  if(rows) h += `<div class="card tw"><table class="t"><thead><tr><th>Stadium</th><th>ab</th><th>Tage</th><th>Art Median</th></tr></thead><tbody>${rows}</tbody></table>
    ${segs.length && !S.broods[i.broodId]?.startDate ? `<p class="small muted" style="margin:8px 0 0">Tipp: Mit einem Startdatum am Zuchtansatz zählt auch das erste Stadium.</p>`:""}</div>`;
  if(W.length>=2) h += `<div class="card">${lineChart(W,"g","g","var(--accent)")}</div>`;
  return h + `</section>`;
}

/* ---- Einzeltier ---- */
VIEWS.animal = r => {
  const i = S.individuals[r.id]; if(!i) return `<div class="empty">Dieses Tier existiert nicht mehr.</div>`;
  const b = S.broods[i.broodId]; const sp = speciesOfBrood(b); const cont = S.containers[i.containerId]; const loc = cont && S.locations[cont.locationId];
  const st = currentStage(i); const alive = isAlive(i);
  const g = statusOf(i)==="tot" ? "dead" : STG(st); const cph = photosOf("individual", i.id).slice(-1)[0];
  const SX = ["L1","L2","L3","L4","L5","vorpuppe","puppe","falter"]; const SXL = {vorpuppe:"Erde",puppe:"Puppe",falter:"Falter"};
  const curI = SX.indexOf(st), maxI = SX.indexOf(STAGES[maxStageIdx(i)]?.k);
  const stepper = `<div class="stepper st-${g}">${SX.map((k,ix)=>`<span class="s ${ix===curI && alive ? "cur" : ix<=Math.max(curI,maxI) ? "done" : ""}"><i></i>${SXL[k]||k}</span>`).join("")}</div>`;
  let h = (cph ? `<div class="cover st-${g}"><img src="${esc(photoSrc(cph))}" alt=""><div class="shade"><span class="sp">${esc(sp?.sci||"")}</span><h1>${esc(i.name)}</h1></div></div>`
    : `<div class="cover noimg st-${g}"><span class="glyph">${ic2(g)}</span><div><span class="sp muted">${esc(sp?.sci||"")}</span><h1>${esc(i.name)}</h1></div></div>`)
    + `<div class="pagehead">
    <div class="meta">${sexBadge(i.sex)}<span class="small">${SEXL[i.sex||"u"]}</span>${stagePill(i)}<button class="pill" data-go="brood:${b?.id}" style="border:0;cursor:pointer">${esc(b?.name||"")}</button>${cont?`<span class="pill">${esc(cont.name)}${loc?" · "+esc(loc.name):""}</span>`:""}</div>
    <div class="chips">${tagsOf(i).map(t=>`<button class="pill tag" data-act="tagSheet" data-id="${i.id}">#${esc(t)}</button>`).join("")}<button class="pill tag add" data-act="tagSheet" data-id="${i.id}">+ Tag</button></div>
    ${i.notes?`<p class="muted" style="margin:0">${esc(i.notes)}</p>`:""}</div>`;
  h += stepper;
  if(alive){
    const q = [];
    const si = SIDX[st];
    if(si===undefined) q.push(["stadium","Stadium festlegen"],["eingegraben","Eingegraben"],["verpuppt","Verpuppt"],["eclosion1","Falter geschlüpft"]);
    if(si>=1 && si<=4) q.push(["haeutung",`Häutung → L${si+1}`,`data-to="L${si+1}"`]);
    if(si>=1 && si<=5) q.push(["eingegraben","Eingegraben"]);
    if(si>=5 && si<=6) q.push(["verpuppt","Verpuppt"]);
    if(si>=6 && si<=7) q.push(["eclosion1","Falter geschlüpft"]);
    if(si===8) q.push(["freigelassen","Freigelassen"],["praepariert","Präpariert"]);
    if(!i.sex || i.sex==="u") q.push(["geschlecht","Geschlecht"]);
    q.push(["tod","Gestorben"],["notiz","Notiz"]);
    if(si!==undefined) q.push(["stadium","Stadium korrigieren"]);
    q.push(["any","Anderes …"]);
    const QI = {haeutung:["moult","larva"],eingegraben:["burrow","burrow"],verpuppt:["pupa","pupa"],eclosion1:["imago","imago"],freigelassen:["release","imago"],praepariert:["pin","imago"],tod:["dead","dead"],notiz:["note","accent"],stadium:["moult","neutral"],any:["more","neutral"],geschlecht:["","accent"]};
    h += `<div class="quick">${q.map(([t,l,x=""])=>{ const [ik,ig]=QI[t]||["more","neutral"]; return `<button class="btn" data-act="${t==="eclosion1"?"eclosion":"quickEv"}" data-t="${t}" data-ind="${i.id}" ${x}><span class="qi st-${ig} ${ik?"":"txt"}">${ik?ic2(ik):"♀♂"}</span>${l}</button>`; }).join("")}</div>`;
  } else {
    h += `<div class="btns"><button class="btn" data-act="quickEv" data-t="any" data-ind="${i.id}">Ereignis eintragen</button></div>`;
  }
  const f = forecast(i);
  if(f && !f.insufficient) h += `<section class="sec"><div class="sec-h"><h2>Schlupfprognose</h2></div><div class="list">${forecastRow(i,f)}</div><p class="small muted" style="margin:0">Basis: ${f.n} bisherige Schlüpfe dieser Art${f.bySex?` (nur ${SEXL[i.sex]})`:""}, gezählt ${f.basis==="verpuppt"?"ab Verpuppung":"ab Eingraben"}. Heute ist Tag ${f.elapsed}.</p></section>`;
  else if(f && f.insufficient) h += `<div class="note">Liegt seit Tag ${Math.floor((Date.now()-f.startMs)/864e5)} (${f.basis==="verpuppt"?"ab Verpuppung":"ab Eingraben"}). Für ein Schlupffenster fehlen noch Vergleichswerte: bisher ${f.n} Schlupf dieser Art.</div>`;
  const cand = candidateImagosOfInd(i.id);
  if(cand.length) h += `<section class="uncertain"><b>Noch nicht zugeordnet</b><span class="small muted">${esc(i.name)} ist aus dieser Puppe geschlüpft, aber welcher Falter es ist, ist noch offen. Kandidat für:</span><div class="list">${cand.map(imagoRow).join("")}</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Fotos</h2></div>${photoGrid(photosOf("individual",i.id),"addPhoto",`data-type="individual" data-id="${i.id}"`)}</section>`;
  h += animalStats(i);
  const ev = evOf(i.id);
  h += `<section class="sec"><div class="sec-h"><h2>Verlauf</h2><span class="small muted">antippen zum Bearbeiten</span></div><div class="card">${ev.length? timeline(ev) : `<div class="empty" style="padding:4px 0">Noch keine Ereignisse.</div>`}</div></section>`;
  h += `<div class="btns"><button class="btn" data-act="editInd" data-id="${i.id}">Tier bearbeiten</button><button class="btn" data-act="labels" data-ind="${i.id}">Etikett</button></div>
  <p class="small muted mono" style="margin:0">Etikett-Code RB:i:${esc(i.id)}</p>`;
  return h;
};

function timeline(evs){
  return `<div class="tl">${[...evs].sort((a,b)=>ms(b.t0)-ms(a.t0) || (b.createdAt||"").localeCompare(a.createdAt||"")).map(e=>{
    const cls = (e.type==="tod"?"death": e.type==="falterschlupf"?"falter": ET[e.type]?.stage?"stagechg":"") + (e.data?.est?" est":"");
    const sk = ET[e.type]?.stage && ET[e.type].stage(e.data||{}); const stc = sk ? " st-"+STG(sk) : "";
    return `<button class="ev ${cls}${stc}" data-act="editEvent" data-id="${e.id}"><span class="dot"></span><span class="body"><span class="w">${esc(fmtTime(e))}</span><br><span class="x">${esc(evTitle(e))}</span>${e.note?`<br><span class="n">${esc(e.note)}</span>`:""}</span></button>`;
  }).join("")}</div>`;
}

function imagoRow(m){
  const ind = m.individualId && S.individuals[m.individualId];
  const ph = photosOf("imago",m.id)[0];
  const sub = ind ? `ist ${esc(ind.name)}` : `Kandidaten: ${(m.candidates||[]).map(indName).map(esc).join(", ")||"keine"}`;
  return `<button class="row" data-go="imago:${m.id}">${ph?`<img src="${esc(photoSrc(ph))}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none">`:sexBadge(m.sex)}<span class="main"><span class="t">${esc(m.label)}</span><span class="s">${sub}</span></span><span class="end">${ind?`<span class="pill good">zugeordnet</span>`:`<span class="pill warn">offen</span>`}</span></button>`;
}
/* ---- Falter ---- */
VIEWS.imagos = () => {
  const open = openImagos().sort((a,b)=>(b.eclosedAt||"").localeCompare(a.eclosedAt||"") || byName(a,b));
  const batches = {}; open.forEach(m => { (batches[m.batchId||m.id] ||= []).push(m); });
  let h = `<div class="pagehead"><h1>Zuordnen</h1><p class="muted" style="margin:0">Schlüpfen mehrere Falter im selben Zeitraum und du weißt nicht, wer aus welcher Puppe kam, landen sie hier als „Falter A, B, C …“. Fotografiere sie und ordne sie zu, sobald du es weißt. Danach gehören Fotos und Notizen zum jeweiligen Tier. Schlupfdatum und Puppenruhe zählen schon vorher.</p></div>
  <div class="btns"><button class="btn primary" data-act="eclosion">Falterschlupf erfassen</button></div>`;
  if(!open.length) return h + `<div class="list"><div class="empty">Nichts offen. Alle Falter sind ihren Tieren zugeordnet.</div></div>`;

VIEWS.climate = () => {
  const locs = all("locations").sort(byName);
  let h = `<div class="pagehead"><h1>Klima</h1><p class="muted" style="margin:0">Temperatur und Luftfeuchte pro Standort. Alle Behälter an einem Standort teilen sich die Messwerte.</p></div>
  <div class="btns"><button class="btn primary" data-act="newMeasure">Messwert eintragen</button><button class="btn" data-act="newLocation">+ Standort</button></div>`;
  if(!locs.length) return h + `<div class="list"><div class="empty">Noch kein Standort. Lege z. B. „Puppenkasten Keller“ oder „Regal Wohnzimmer“ an.</div></div>`;
  h += `<div class="list">${locs.map(l=>{ const ms_ = measOf(l.id); const last = ms_[ms_.length-1];
    return `<button class="row" data-go="location:${l.id}"><span class="main"><span class="t">${esc(l.name)}</span><span class="s">${last?`zuletzt ${dDE(last.at)} ${last.at.slice(11,16)}`:"noch keine Messung"} · ${ms_.length} Werte${l.sensor?" · Sensor":""}</span></span><span class="end">${last?`<span class="pill mono">${last.temp!=null?fmtN(last.temp,1)+" °C":""}${last.temp!=null&&last.rh!=null?" · ":""}${last.rh!=null?fmtN(last.rh,0)+" %":""}</span>`:""}</span></button>`; }).join("")}</div>`;
  h += `<div class="note">Öffne einen Standort, um einen Bluetooth-Sensor (Xiaomi LYWSD03MMC) zu koppeln und den aktuellen Wert abzurufen. Ältere Verläufe kannst du dort als CSV importieren.</div>`;
  return h;
};
function measOf(locId){
  const out=[];
  for(const d of all("climate")){ if(d.locationId!==locId) continue; for(const p of (d.pts||[])) out.push({at:`${d.date}T${p[0]}`, temp:p[1], rh:p[2], src:p[3]||"m", key:`${d.id}|${p[0]}`}); }
  return out.sort((a,b)=>a.at.localeCompare(b.at));
}

function lineChart(pts, key, unit, color){
  let P = pts.filter(p=>p[key]!=null && Number.isFinite(+p[key]));
  if(P.length>360){ const k=Math.ceil(P.length/360); const Q=[]; for(let i=0;i<P.length;i+=k){ const g=P.slice(i,i+k); Q.push({at:g[Math.floor(g.length/2)].at, [key]:g.reduce((a,x)=>a+(+x[key]),0)/g.length}); } P=Q; }
  if(P.length<2) return `<p class="small muted">Für ein Diagramm braucht es mindestens 2 Werte.</p>`;
  const W=340,H=150,l=30,rt=8,t=14,b=22;
  const xs=P.map(p=>ms(p.at)), ys=P.map(p=>+p[key]);
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0) x1=x0+1;
  let y0=Math.floor(Math.min(...ys)-1), y1=Math.ceil(Math.max(...ys)+1);
  const X=v=>l+(v-x0)/(x1-x0)*(W-l-rt), Y=v=>t+(1-(v-y0)/(y1-y0))*(H-t-b);
  const ticks=[]; const step=Math.max(1,Math.ceil((y1-y0)/4)); for(let v=y0; v<=y1; v+=step) ticks.push(v);
  const d=P.map((p,i)=>`${i?"L":"M"}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join("");
  const area=d+`L${X(xs[xs.length-1]).toFixed(1)},${H-b}L${X(xs[0]).toFixed(1)},${H-b}Z`;
  const lx=X(xs[xs.length-1]), ly=Y(ys[ys.length-1]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key==="temp"?"Temperaturverlauf":"Luftfeuchteverlauf"}">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join("")}
    <path d="${area}" fill="${color}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="4" fill="${color}"/>
    <text x="${l}" y="${H-8}">${dShort(P[0].at)}</text><text x="${W-rt}" y="${H-8}" text-anchor="end">${dShort(P[P.length-1].at)}</text>
    <text x="${l}" y="${t-2}" text-anchor="start">${unit}</text></svg></div>`;
}
VIEWS.location = r => {
  const l = S.locations[r.id]; if(!l) return `<div class="empty">Standort existiert nicht mehr.</div>`;
  const M = measOf(l.id); const rng = R.locRange||"30";
  const cut = rng==="alle" ? 0 : Date.now()-(+rng)*864e5;
  const P = M.filter(m=>ms(m.at)>=cut);
  const stat = k => { const v=P.map(p=>p[k]).filter(x=>x!=null).map(Number); return v.length? `${fmtN(Math.min(...v),1)} / ${fmtN(v.reduce((a,b)=>a+b,0)/v.length,1)} / ${fmtN(Math.max(...v),1)}` : "–"; };
  const conts = all("containers").filter(c=>c.locationId===l.id);
  let h = `<div class="pagehead"><h1>${esc(l.name)}</h1>${l.notes?`<p class="muted" style="margin:0">${esc(l.notes)}</p>`:""}</div>
  <div class="btns"><button class="btn primary" data-act="newMeasure" data-loc="${l.id}">Messwert</button><button class="btn" data-act="importCsv" data-loc="${l.id}">CSV-Import</button><button class="btn" data-act="editLocation" data-id="${l.id}">Bearbeiten</button></div>
  ${sensorCard(l)}
  <div class="seg" role="group">${[["7","7 Tage"],["30","30 Tage"],["90","90 Tage"],["alle","Alle"]].map(([k,t])=>`<button data-act="locRange" data-k="${k}" aria-pressed="${k===rng}">${t}</button>`).join("")}</div>
  <div class="card tw"><table class="t"><thead><tr><th></th><th>min / Ø / max</th><th>n</th></tr></thead><tbody><tr><td>Temperatur °C</td><td>${stat("temp")}</td><td>${P.filter(p=>p.temp!=null).length}</td></tr><tr><td>Luftfeuchte %</td><td>${stat("rh")}</td><td>${P.filter(p=>p.rh!=null).length}</td></tr></tbody></table></div>
  <section class="sec"><div class="sec-h"><h2>Temperatur</h2></div><div class="card">${lineChart(P,"temp","°C","var(--crit)")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Luftfeuchte</h2></div><div class="card">${lineChart(P,"rh","%","var(--accent)")}</div></section>
  <section class="sec"><div class="sec-h"><h2>Behälter hier</h2></div><div class="list">${conts.length? conts.map(c=>`<div class="row static"><span class="main"><span class="t">${esc(c.name)}</span><span class="s">${all("individuals").filter(i=>i.containerId===c.id).length} Tiere</span></span></div>`).join("") : `<div class="empty">Keine Behälter zugeordnet (unter Mehr → Behälter).</div>`}</div></section>
  <section class="sec"><div class="sec-h"><h2>Letzte Werte</h2></div><div class="list">${[...M].reverse().slice(0,12).map(m=>`<button class="row" data-act="editMeasure" data-id="${esc(m.key)}"><span class="main"><span class="t mono">${dDE(m.at)} ${m.at.slice(11,16)}</span><span class="s">${m.src==="c"?"Import":m.src==="b"?"Sensor":"manuell"}</span></span><span class="end mono">${m.temp!=null?fmtN(m.temp,1)+" °C":""} ${m.rh!=null?fmtN(m.rh,0)+" %":""}</span></button>`).join("") || `<div class="empty">Noch keine Werte.</div>`}</div></section>`;
  return h;
};
