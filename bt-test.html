<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raupenbuch · Sensor-Test</title>
<style>
:root{--bg:#ECEEE7;--surface:#F8F9F4;--ink:#1C1F1A;--muted:#5B6157;--line:#CDD2C5;--accent:#2F5276;--accent-ink:#fff;--good:#356231;--crit:#A0362A}
@media (prefers-color-scheme:dark){:root{--bg:#111412;--surface:#1A1E1B;--ink:#E5E8E0;--muted:#9BA196;--line:#30362F;--accent:#8EB0D8;--accent-ink:#0F1A26;--good:#86BC7C;--crit:#E8806D;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Georgia,serif;font-size:26px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.vals b{display:block;font:500 28px ui-monospace,monospace}
.vals span{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,monospace;margin:0;color:var(--muted);max-height:260px;overflow:auto}
.muted{color:var(--muted);font-size:14px}.ok{color:var(--good)}.err{color:var(--crit)}
</style>
</head>
<body>
<main>
  <h1>Sensor-Test</h1>
  <p class="muted" style="margin:0">Prüft, ob dein Xiaomi-Hygrometer (LYWSD03MMC) mit Original-Firmware seine aktuellen Werte per Bluetooth herausgibt. Bluetooth am Handy einschalten und Xiaomi Home am besten vorher schließen.</p>
  <div id="support" class="card"></div>
  <button class="btn primary" id="go">Sensor suchen und verbinden</button>
  <button class="btn" id="all">Alle Bluetooth-Geräte anzeigen</button>
  <div class="card vals"><div><b id="t">–</b><span>°C</span></div><div><b id="h">–</b><span>% rel. Feuchte</span></div><div><b id="v">–</b><span>Batterie V</span></div></div>
  <div class="card"><div id="status" class="muted">Noch nicht verbunden.</div></div>
  <div class="card"><pre id="log"></pre></div>
</main>
<script>
const SVC = "ebe0ccb0-7a0a-4b0c-8a1a-6ff2997da3a6";
const CHR = "ebe0ccc1-7a0a-4b0c-8a1a-6ff2997da3a6";
const $ = id => document.getElementById(id);
const log = m => { $("log").textContent += new Date().toLocaleTimeString("de-DE") + "  " + m + "\n"; };
const status = (m, cls) => { $("status").textContent = m; $("status").className = cls || "muted"; };
if(!navigator.bluetooth){
  $("support").innerHTML = '<span class="err">Web Bluetooth ist in diesem Browser nicht verfügbar.</span><br><span class="muted">Bitte in Chrome auf Android öffnen. Falls es dort auch nicht geht: chrome://flags → „Experimental Web Platform features“ einschalten und Chrome neu starten.</span>';
  $("go").disabled = $("all").disabled = true;
} else {
  $("support").innerHTML = '<span class="ok">Web Bluetooth ist verfügbar.</span>';
}
let n = 0;
async function connect(opts){
  try {
    status("Wähle den Sensor in der Liste aus …");
    const dev = await navigator.bluetooth.requestDevice(opts);
    log("Gerät gewählt: " + (dev.name || "(ohne Namen)") + " · " + dev.id);
    dev.addEventListener("gattserverdisconnected", () => { log("Verbindung getrennt"); status("Verbindung getrennt.", "err"); });
    status("Verbinde …");
    const srv = await dev.gatt.connect(); log("Verbunden");
    try {
      const all = await srv.getPrimaryServices();
      log("Dienste: " + all.map(s => s.uuid.slice(0,8)).join(", "));
    } catch(e){ log("Dienste nicht auflistbar: " + e.message); }
    const s = await srv.getPrimaryService(SVC); log("Temperatur-Dienst gefunden");
    const c = await s.getCharacteristic(CHR); log("Messwert-Merkmal gefunden");
    c.addEventListener("characteristicvaluechanged", ev => {
      const d = ev.target.value;
      const t = d.getInt16(0, true) / 100, h = d.getUint8(2), v = d.byteLength >= 5 ? d.getUint16(3, true) / 1000 : null;
      $("t").textContent = t.toFixed(2).replace(".", ","); $("h").textContent = h; $("v").textContent = v != null ? v.toFixed(3).replace(".", ",") : "–";
      n++; log(`Wert ${n}: ${t.toFixed(2)} °C, ${h} %, ${v ?? "?"} V (${d.byteLength} Bytes)`);
      status(`Es funktioniert: ${n} Wert(e) empfangen.`, "ok");
    });
    await c.startNotifications(); log("Warte auf Messwerte (kann bis zu ~10 s dauern) …");
    status("Verbunden, warte auf Messwerte …");
  } catch(e){
    log("Fehler: " + e.name + ": " + e.message);
    status(e.name === "NotFoundError" ? "Kein Gerät gewählt oder keins gefunden." : "Fehler: " + e.message, "err");
  }
}
$("go").onclick = () => connect({filters:[{namePrefix:"LYWSD03"},{namePrefix:"ATC_"}], optionalServices:[SVC]});
$("all").onclick = () => connect({acceptAllDevices:true, optionalServices:[SVC]});
</script>
</body>
</html>
