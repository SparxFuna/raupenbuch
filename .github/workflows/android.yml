# Baut die Android-App (Capacitor) aus der Web-App und stellt die APK als GitHub-Release bereit:
# https://github.com/SparxFuna/raupenbuch/releases/latest/download/raupenbuch.apk
name: Android-App

on:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "app-icons/**", "android-build/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version lesen
        id: ver
        run: echo "v=$(grep -oP 'const APP_VERSION = "\K[0-9.]+' index.html)" >> "$GITHUB_OUTPUT"

      - name: Web-App einsammeln
        working-directory: android-build
        run: |
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../*.js ../*.woff2 ../icon*.png www/
          cp -r ../app-icons www/

      - name: Android-Projekt erzeugen
        working-directory: android-build
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node customize.mjs

      - name: Signaturschlüssel
        env:
          KS: ${{ secrets.RB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android-build/android/app/release.p12; echo "Schlüssel vorhanden"; else echo "::warning::Kein Signaturschlüssel (Secret RB_KEYSTORE_B64) – es wird eine Debug-APK gebaut."; fi

      - name: APK bauen
        working-directory: android-build/android
        env:
          RB_KS_PASS: ${{ secrets.RB_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          if [ -f app/release.p12 ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../raupenbuch.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../raupenbuch.apk
          fi

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.v }}
          name: Raupenbuch Android ${{ steps.ver.outputs.v }}
          body: "Android-App zur Web-App-Version ${{ steps.ver.outputs.v }}. Auf dem Handy herunterladen und installieren – eine vorhandene Raupenbuch-App wird dabei aktualisiert, die Daten bleiben."
          files: android-build/raupenbuch.apk
          make_latest: true
          overwrite_files: true
