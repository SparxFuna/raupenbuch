# Baut das Raupi-Zifferblatt (Watch Face Format) für Wear OS / Galaxy Watch und stellt es als Release bereit.
name: Zifferblatt

on:
  push:
    branches: [main]
    paths: ["watchface/**", ".github/workflows/watchface.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watchface
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: XML prüfen (offizieller WFF-Validator)
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/gwf
          cd /tmp/gwf/third_party/wff && chmod +x gradlew && ./gradlew -q :specification:validator:executable-jar
          java -jar specification/validator/build/libs/wff-validator.jar 1 "$GITHUB_WORKSPACE/watchface/src/main/res/raw/watchface.xml"

      - name: Raupi-Bilder aus der App rendern
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
          python3 watchface/render.py

      - name: Signaturschlüssel
        env:
          KS: ${{ secrets.RB_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > watchface/release.p12; fi

      - name: Zifferblatt bauen
        working-directory: watchface
        env:
          RB_KS_PASS: ${{ secrets.RB_KEYSTORE_PASS }}
          WF_CODE: ${{ github.run_number }}
          WF_NAME: 1.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk ../raupi-zifferblatt.apk

      - name: Speicherbedarf prüfen
        continue-on-error: true
        run: |
          cd /tmp/gwf/play-validations && chmod +x gradlew && ./gradlew -q :memory-footprint:executable-jar
          java -jar memory-footprint/build/libs/memory-footprint.jar --watch-face "$GITHUB_WORKSPACE/raupi-zifferblatt.apk" --schema-version 1 --ambient-limit-mb 10 --active-limit-mb 100 --apply-v1-offload-limitations --estimate-optimization

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watchface-v1.${{ github.run_number }}
          name: Raupi-Zifferblatt 1.${{ github.run_number }}
          body: "Raupi als Zifferblatt für Wear OS (z. B. Galaxy Watch 4 oder neuer). Installation per Wear Installer oder adb, siehe README."
          files: raupi-zifferblatt.apk
          make_latest: false
          overwrite_files: true
